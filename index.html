<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصحف سميع - تلاوة وتفسير</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        /* --- الألوان والتصميم الراقي --- */
        :root {
            --primary-dark: #0f172a; 
            --primary-light: #1e293b;
            --gold-accent: #d4af37; 
            --gold-hover: #b5952f;
            --bg-color: #fdfbf7; 
            --text-main: #334155;
            --white-glass: rgba(255, 255, 255, 0.95);
        }

        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg-color); margin: 0; color: var(--text-main); background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><path d="M50 0 L100 50 L50 100 L0 50 Z" fill="none" stroke="%23f0ece1" stroke-width="0.5"/></svg>'); background-size: 150px; }
        
        .navbar { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); color: white; display: flex; justify-content: space-between; align-items: center; padding: 15px 50px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; border-bottom: 2px solid var(--gold-accent); }
        .navbar h1 { font-family: 'Amiri', serif; margin: 0; font-size: 34px; color: var(--gold-accent); letter-spacing: 1px; }
        .nav-btns { display: flex; gap: 15px; }
        .btn-outline { background: transparent; color: var(--gold-accent); border: 1px solid var(--gold-accent); padding: 8px 20px; border-radius: 25px; font-family: inherit; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-outline:hover { background: var(--gold-accent); color: var(--primary-dark); }
        .btn-solid { background: var(--gold-accent); color: var(--primary-dark); border: none; padding: 8px 20px; border-radius: 25px; font-family: inherit; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-solid:hover { background: var(--gold-hover); transform: translateY(-2px); }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .app-card { background: var(--white-glass); border-radius: 20px; box-shadow: 0 15px 50px rgba(0,0,0,0.05); border: 1px solid rgba(212, 175, 55, 0.2); overflow: hidden; min-height: 600px; }
        
        .settings-panel { background: var(--primary-dark); color: white; padding: 30px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; align-items: center; border-bottom: 4px solid var(--gold-accent); }
        .settings-panel select, .settings-panel button { padding: 12px 15px; font-size: 15px; font-family: inherit; border-radius: 10px; border: none; outline: none; width: 100%; font-weight: bold; transition: 0.3s; }
        .settings-panel select { background-color: rgba(255,255,255,0.1); color: white; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); }
        .settings-panel select option { background: var(--primary-dark); color: white; }
        .settings-panel select:focus { border-color: var(--gold-accent); }
        
        #riwayah-select { background-color: rgba(212, 175, 55, 0.15); border: 1px solid var(--gold-accent); color: var(--gold-accent); }
        
        .btn-play-main { background: var(--gold-accent) !important; color: var(--primary-dark) !important; font-size: 18px !important; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); }
        .btn-play-main:hover { background: var(--gold-hover) !important; transform: scale(1.03); }

        /* مساحة المصحف */
        .quran-area { padding: 50px; text-align: justify; direction: rtl; min-height: 450px; transition: 0.5s; }
        .mushaf-hafs { font-family: 'Amiri', serif; font-size: 38px; line-height: 2.3; color: #1e293b; }
        .mushaf-warsh { font-family: 'Amiri', serif; font-size: 42px; line-height: 2.5; color: #4a2c00; font-weight: bold; }
        .mushaf-qalun { font-family: 'Amiri', serif; font-size: 36px; line-height: 2.6; color: #0f172a; }

        .verse { cursor: pointer; padding: 2px 10px; border-radius: 10px; transition: all 0.3s ease; display: inline; }
        .verse:hover { background-color: rgba(212, 175, 55, 0.1); }
        .verse-end { color: var(--gold-accent); font-size: 28px; margin: 0 8px; user-select: none; font-weight: normal; }
        .active-verse { background-color: rgba(212, 175, 55, 0.2); color: var(--primary-dark); font-weight: bold; border-bottom: 2px solid var(--gold-accent); }

        /* شاشات الإدارة والمستخدمين */
        .hidden-screen { display: none; }
        .auth-container { padding: 60px 20px; text-align: center; max-width: 500px; margin: 0 auto; }
        .auth-title { color: var(--primary-dark); font-size: 28px; margin-bottom: 10px; }
        .form-group { margin-bottom: 20px; text-align: right; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--primary-dark); }
        .form-group input { width: 100%; padding: 15px; border: 2px solid #e2e8f0; border-radius: 10px; font-family: inherit; font-size: 16px; transition: 0.3s; background: #f8fafc; }
        .form-group input:focus { border-color: var(--gold-accent); outline: none; background: #fff; }
        .auth-btn-submit { background: var(--primary-dark); color: white; padding: 15px 30px; font-size: 18px; border: none; border-radius: 10px; cursor: pointer; width: 100%; font-family: inherit; font-weight: bold; transition: 0.3s; }
        .auth-btn-submit:hover { background: var(--gold-accent); color: var(--primary-dark); }

        /* النوافذ المنبثقة */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.7); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(8px); }
        .modal-content { background: #fff; padding: 30px; border-radius: 20px; width: 90%; max-width: 650px; text-align: center; border: 1px solid var(--gold-accent); position: relative; }
        .close-modal { position: absolute; top: 15px; left: 15px; font-size: 22px; cursor: pointer; color: #94a3b8; background: none; border: none; transition: 0.3s; }
        .close-modal:hover { color: #ef4444; }
        
        .ayah-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }
        .action-btn { padding: 15px; font-size: 16px; font-family: inherit; font-weight: bold; border-radius: 12px; border: none; cursor: pointer; transition: 0.3s; }
        .action-play { background: var(--primary-light); color: white; }
        .action-tafsir { background: var(--bg-color); color: var(--primary-dark); border: 2px solid var(--primary-dark); }
        .action-copy { background: #f1f5f9; color: #475569; }
        .action-share { background: var(--gold-accent); color: var(--primary-dark); }

        .tafsir-text-box { font-family: 'Amiri', serif; font-size: 24px; line-height: 2.2; text-align: justify; padding: 25px; background: #f8fafc; border-radius: 12px; margin-top: 20px; border-right: 4px solid var(--gold-accent); max-height: 400px; overflow-y: auto; color: #334155; }

        #share-card-container { position: absolute; top: -9999px; left: -9999px; } 
        .share-card { width: 800px; padding: 60px; background: linear-gradient(135deg, #fdfbf7, #fff); border: 20px solid var(--primary-dark); box-sizing: border-box; text-align: center; font-family: 'Amiri', serif; position: relative; }

        /* --- تنسيق التوقيع والتواصل الفاخر (جديد) --- */
        .footer-divider {
            border: 0;
            height: 3px;
            background: linear-gradient(to right, transparent, var(--gold-accent), transparent);
            margin: 60px auto 30px auto;
            width: 80%;
            border-radius: 50%;
        }
        .footer-signature { text-align: center; padding-bottom: 40px; color: var(--primary-dark); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 15px; }
        .signature-name { font-size: 22px; font-weight: 800; font-family: 'Tajawal', sans-serif; letter-spacing: 1px; color: var(--primary-dark); text-shadow: 1px 1px 2px rgba(0,0,0,0.05); }
        .wa-btn { background: linear-gradient(135deg, #25D366, #128C7E); color: white; padding: 12px 30px; border-radius: 30px; text-decoration: none; display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: bold; transition: 0.3s; box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3); border: 2px solid transparent; }
        .wa-btn:hover { background: #fff; color: #128C7E; border-color: #128C7E; transform: translateY(-3px); box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4); }
    </style>
</head>
<body>

    <nav class="navbar">
        <h1 id="site-main-title">مصحف سَمِيع</h1>
        <div class="nav-btns">
            <button class="btn-outline" onclick="switchTab('app-main')">الرئيسية</button>
            <button class="btn-solid" onclick="switchTab('user-login-screen')">دخول المستخدمين</button>
            <button class="btn-outline" onclick="switchTab('admin-screen')" style="border-color: rgba(255,255,255,0.2); color: #cbd5e1;">الإدارة</button>
        </div>
    </nav>

    <div class="container">
        <!-- الشاشة الرئيسية للمصحف -->
        <div id="app-main" class="app-card">
            <div class="settings-panel">
                <select id="surah-select" onchange="onSurahChange()"><option>جاري التحميل...</option></select>
                
                <select id="riwayah-select" onchange="filterRecitersByRiwayah()">
                    <option value="hafs">رواية حفص عن عاصم</option>
                    <option value="warsh">رواية ورش عن نافع</option>
                    <option value="qalun">رواية قالون عن نافع</option>
                    <option value="douri">رواية الدوري عن أبي عمرو</option>
                    <option value="shubah">رواية شعبة عن عاصم</option>
                    <option value="soussi">رواية السوسي عن أبي عمرو</option>
                    <option value="hamza">رواية خلف عن حمزة</option>
                </select>

                <select id="reciter-select" onchange="resetAudioState()">
                    <option value="">جاري جلب جميع قراء العالم...</option>
                </select>

                <select id="tafsir-select">
                    <option value="ar.ibnkathir">تفسير ابن كثير (السنة)</option>
                    <option value="ar.saadi">تفسير السعدي (السنة)</option>
                    <option value="ar.tabari">تفسير الطبري</option>
                    <option value="ar.qurtubi">تفسير القرطبي</option>
                    <option value="ar.baghawi">تفسير البغوي</option>
                    <option value="ar.muyassar">التفسير الميسر</option>
                </select>

                <button id="play-btn" class="btn-play-main" onclick="togglePlayGlobal()">
                    <span id="play-icon">⏵</span> <span id="play-text">بدء التلاوة</span>
                </button>
            </div>

            <div id="quran-display" class="quran-area mushaf-hafs">جاري تهيئة المصحف الشريف...</div>

            <audio id="main-audio"></audio>
            <audio id="preload-audio"></audio>
        </div>

        <!-- باقي الشاشات (المستخدم، الإدارة) مخفية -->
        <div id="user-login-screen" class="app-card hidden-screen auth-container">
            <h2 class="auth-title">تسجيل دخول المستخدم</h2>
            <div class="form-group"><label>البريد الإلكتروني</label><input type="email" placeholder="user@example.com"></div>
            <div class="form-group"><label>كلمة المرور</label><input type="password" placeholder="••••••••"></div>
            <button class="auth-btn-submit">تسجيل الدخول</button>
        </div>

        <div id="admin-screen" class="app-card hidden-screen auth-container">
            <div id="admin-login-form">
                <h2 class="auth-title">بوابة الإدارة المركزية</h2>
                <div class="form-group"><label>بريد الإدارة</label><input type="email" id="admin-email" dir="ltr"></div>
                <div class="form-group"><label>الرقم السري</label><input type="password" id="admin-pass" dir="ltr"></div>
                <button class="auth-btn-submit" onclick="loginAdmin()">تأكيد الدخول</button>
                <p id="login-error" style="color: #ef4444; display: none;">بيانات الإدارة غير صحيحة.</p>
            </div>
            
            <div id="dashboard-view" style="display: none; text-align: right;">
                <h2 style="color: var(--primary-dark);">لوحة تحكم موقع سَمِيع</h2>
                <div style="background: #f8fafc; padding: 25px; border-radius: 12px; margin-top: 20px;">
                    <div class="form-group" style="max-width: 100%;"><label>اسم المنصة العلوي</label><input type="text" id="edit-site-title" value="مصحف سَمِيع"></div>
                    <button class="auth-btn-submit" onclick="saveAdminSettings()">حفظ التعديلات</button>
                </div>
                <button class="btn-outline" style="color: #ef4444; border-color: #ef4444; margin-top: 30px; width: 100%;" onclick="logoutAdmin()">تسجيل الخروج</button>
            </div>
        </div>
    </div>

    <!-- النوافذ المنبثقة -->
    <div id="action-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModals()">✖</button>
            <h3 style="color: var(--primary-dark); margin-top: 0;">خيارات الآية</h3>
            <p id="selected-ayah-preview" style="font-family: 'Amiri', serif; font-size: 26px; color: var(--text-main); margin: 20px 0;"></p>
            <div class="ayah-actions">
                <button class="action-btn action-play" onclick="playAyahFromModal()">⏵ استماع للآية</button>
                <button class="action-btn action-tafsir" onclick="openTafsirModal()">📖 التفسير الموثق</button>
                <button class="action-btn action-copy" onclick="copyAyahText()">📋 نسخ النص</button>
            </div>
        </div>
    </div>

    <div id="tafsir-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 800px;">
            <button class="close-modal" onclick="closeModals()">✖</button>
            <h3 id="tafsir-modal-title" style="color: var(--primary-dark); margin-top: 0;">التفسير</h3>
            <div id="tafsir-modal-text" class="tafsir-text-box">جاري جلب التفسير...</div>
        </div>
    </div>

    <!-- التوقيع وخط الفصل الراقي -->
    <hr class="footer-divider">
    <div class="footer-signature">
        <span class="signature-name">الإدارة الفنية والإشراف: د. محمد أبو زيد</span>
        <a href="https://wa.me/201005080532" class="wa-btn" target="_blank">
            <svg width="22" height="22" fill="currentColor" viewBox="0 0 16 16"><path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c-.003 1.396.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c.004-3.639 2.961-6.592 6.602-6.592 1.76 0 3.414.687 4.658 1.933a6.563 6.563 0 0 1 1.93 4.66 c-.004 3.639-2.961 6.592-6.602 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.005-.247-.005-.38-.005s-.346.05-.528.248c-.182.198-.691.675-.691 1.648 0 .973.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/></svg>
            تواصل معي عبر الواتساب
        </a>
    </div>

    <script>
        let currentSurahData = null;
        let selectedAyahIndex = 0;
        let isPlaying = false;
        let rawAyahsTexts = []; 
        let allGlobalReciters = []; 

        const els = {
            surahSelect: document.getElementById('surah-select'),
            riwayahSelect: document.getElementById('riwayah-select'),
            reciterSelect: document.getElementById('reciter-select'),
            tafsirSelect: document.getElementById('tafsir-select'),
            playBtn: document.getElementById('play-btn'),
            playText: document.getElementById('play-text'),
            playIcon: document.getElementById('play-icon'),
            quranDisplay: document.getElementById('quran-display'),
            mainAudio: document.getElementById('main-audio'),
            preloadAudio: document.getElementById('preload-audio')
        };

        // 1. التهيئة وجلب كل القراء بلا استثناء
        async function initializeApp() {
            try {
                const res = await fetch('https://api.alquran.cloud/v1/meta');
                const data = await res.json();
                els.surahSelect.innerHTML = '';
                data.data.surahs.references.forEach(s => {
                    els.surahSelect.add(new Option(`${s.number}. سورة ${s.name}`, s.number));
                });
                
                // جلب قائمة القراء بالكامل من الخادم
                const reciterRes = await fetch('https://api.alquran.cloud/v1/edition?format=audio&language=ar&type=versebyverse');
                const reciterData = await reciterRes.json();
                
                allGlobalReciters = reciterData.data;
                
                filterRecitersByRiwayah();
            } catch (err) {
                els.quranDisplay.innerHTML = '<span style="color:#ef4444; font-weight:bold;">حدث خطأ في الاتصال بالخوادم.</span>';
            }
        }

        // 2. فلترة ذكية لجميع القراء حسب الرواية 
        function filterRecitersByRiwayah() {
            stopAndResetAudio(); // تفريغ ذاكرة الصوت لتجنب المشاكل
            
            const selectedRiwayah = els.riwayahSelect.value;
            els.reciterSelect.innerHTML = '';
            
            // خوارزمية ذكية لاستخراج القراء المطابقين للرواية
            allGlobalReciters.forEach(r => {
                let n = r.name.toLowerCase();
                let en = (r.englishName || "").toLowerCase();
                
                let matches = false;
                if(selectedRiwayah === 'warsh' && (n.includes('ورش') || en.includes('warsh'))) matches = true;
                else if(selectedRiwayah === 'qalun' && (n.includes('قالون') || en.includes('qaloon'))) matches = true;
                else if(selectedRiwayah === 'douri' && (n.includes('دوري') || en.includes('douri'))) matches = true;
                else if(selectedRiwayah === 'shubah' && (n.includes('شعبة') || en.includes('shubah'))) matches = true;
                else if(selectedRiwayah === 'soussi' && (n.includes('سوسي') || en.includes('soussi'))) matches = true;
                else if(selectedRiwayah === 'hamza' && (n.includes('حمزة') || en.includes('hamza') || n.includes('خلف'))) matches = true;
                
                // لو اخترنا حفص، يجيب كل القراء اللي مش مكتوب جنبهم رواية تانية
                else if(selectedRiwayah === 'hafs' && !n.includes('ورش') && !n.includes('قالون') && !n.includes('دوري') && !n.includes('شعبة') && !n.includes('سوسي') && !n.includes('حمزة') && !n.includes('خلف')) {
                    matches = true;
                }

                if(matches) {
                    els.reciterSelect.add(new Option(r.name, r.identifier));
                }
            });

            // تعديل شكل المصحف
            els.quranDisplay.className = 'quran-area';
            if(selectedRiwayah === 'hafs') els.quranDisplay.classList.add('mushaf-hafs');
            else if(selectedRiwayah === 'warsh') els.quranDisplay.classList.add('mushaf-warsh');
            else els.quranDisplay.classList.add('mushaf-qalun');

            loadQuranText();
        }

        // --- نظام إيقاف وإعادة ضبط الصوت الصارم ---
        function stopAndResetAudio() {
            els.mainAudio.pause();
            els.mainAudio.removeAttribute('src'); 
            els.mainAudio.load(); 
            isPlaying = false;
            updatePlayButton();
        }

        function onSurahChange() {
            stopAndResetAudio(); // عند تغيير السورة يقف الصوت فوراً
            loadQuranText();
        }

        function resetAudioState() {
            stopAndResetAudio(); // عند تغيير القارئ يقف الصوت فوراً
            selectedAyahIndex = 0;
            updateHighlight(0);
        }

        // --- تحميل الآيات ---
        async function loadQuranText() {
            const surahNum = els.surahSelect.value || 1;
            els.quranDisplay.innerHTML = 'جاري ضبط المصحف...';

            try {
                const quranRes = await fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/quran-uthmani`);
                currentSurahData = (await quranRes.json()).data;
                rawAyahsTexts = [];
                renderQuranText();
            } catch (err) {
                console.error("Error loading quran");
            }
        }

        function renderQuranText() {
            els.quranDisplay.innerHTML = '';
            currentSurahData.ayahs.forEach((ayah, index) => {
                let text = ayah.text;
                if (index === 0 && currentSurahData.number !== 1 && text.startsWith('بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ')) {
                    text = text.replace('بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ', '');
                }
                
                rawAyahsTexts.push(text); 
                const span = document.createElement('span');
                span.className = 'verse';
                span.id = `v-${index}`;
                span.innerHTML = `${text} <span class="verse-end">﴿${ayah.numberInSurah}﴾</span> `;
                span.onclick = () => { openActionModal(index); };
                els.quranDisplay.appendChild(span);
            });
            updateHighlight(selectedAyahIndex);
        }

        // --- النوافذ والمشاركة ---
        function openActionModal(index) {
            selectedAyahIndex = index;
            document.getElementById('selected-ayah-preview').innerText = `﴿ ${rawAyahsTexts[index]} ﴾`;
            document.getElementById('action-modal').style.display = 'flex';
        }

        function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none'); }

        function playAyahFromModal() {
            closeModals();
            stopAndResetAudio();
            setupAudioForAyah(selectedAyahIndex);
            els.mainAudio.play();
            isPlaying = true;
            updatePlayButton();
        }

        function copyAyahText() {
            const siteTitle = document.getElementById('site-main-title').innerText;
            const textToCopy = `﴿ ${rawAyahsTexts[selectedAyahIndex]} ﴾\n[سورة ${currentSurahData.name} - آية ${currentSurahData.ayahs[selectedAyahIndex].numberInSurah}]\n${siteTitle}`;
            navigator.clipboard.writeText(textToCopy).then(() => { alert("تم النسخ بنجاح!"); });
        }

        async function openTafsirModal() {
            document.getElementById('action-modal').style.display = 'none';
            document.getElementById('tafsir-modal').style.display = 'flex';
            const tafsirBox = document.getElementById('tafsir-modal-text');
            const tafsirId = els.tafsirSelect.value;
            tafsirBox.innerHTML = "جاري جلب التفسير من أمهات الكتب...";

            const globalNum = currentSurahData.ayahs[selectedAyahIndex].number;
            try {
                const res = await fetch(`https://api.alquran.cloud/v1/ayah/${globalNum}/${tafsirId}`);
                const data = await res.json();
                tafsirBox.innerHTML = data.data.text;
            } catch(e) { tafsirBox.innerHTML = "حدث خطأ في جلب التفسير."; }
        }

        // --- محرك الصوتيات الموثوق (النسخة الذكية) ---
        function setupAudioForAyah(index) {
            if (!currentSurahData || els.reciterSelect.options.length === 0) return;
            selectedAyahIndex = index;
            
            const globalNum = currentSurahData.ayahs[index].number;
            const reciterId = els.reciterSelect.value;

            els.mainAudio.src = `https://cdn.islamic.network/quran/audio/128/${reciterId}/${globalNum}.mp3`;
            updateHighlight(index);
        }

        // --- مستشعر المصاحف غير المكتملة أو الروابط المكسورة ---
        els.mainAudio.onerror = () => {
            // محاولة تخفيض الجودة لـ 64 إذا فشلت الـ 128
            if (els.mainAudio.src.includes('/128/')) {
                els.mainAudio.src = els.mainAudio.src.replace('/128/', '/64/');
                if (isPlaying) els.mainAudio.play();
            } else {
                // في حالة أن القارئ لم يسجل هذه السورة إطلاقاً
                stopAndResetAudio();
                alert("عذراً! يبدو أن هذا القارئ لم يسجل هذه السورة بهذه الرواية، أو أن التسجيل غير متاح على الخوادم العالمية حالياً. يرجى تجربة سورة أخرى أو اختيار قارئ آخر.");
            }
        };

        function updateHighlight(index) {
            document.querySelectorAll('.verse').forEach(el => el.classList.remove('active-verse'));
            const activeVerse = document.getElementById(`v-${index}`);
            if (activeVerse) {
                activeVerse.classList.add('active-verse');
                activeVerse.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function togglePlayGlobal() {
            if(els.reciterSelect.options.length === 0) return alert("لا يوجد قراء لهذه الرواية.");
            if(!els.mainAudio.src) setupAudioForAyah(selectedAyahIndex);
            
            if (isPlaying) { els.mainAudio.pause(); } 
            else { els.mainAudio.play(); }
            isPlaying = !isPlaying;
            updatePlayButton();
        }

        function updatePlayButton() {
            els.playText.innerText = isPlaying ? "إيقاف مؤقت" : "بدء التلاوة";
            els.playIcon.innerText = isPlaying ? "⏸" : "⏵";
            els.playBtn.style.background = isPlaying ? "#ef4444" : "var(--gold-accent)";
            els.playBtn.style.color = isPlaying ? "#fff" : "var(--primary-dark)";
        }

        els.mainAudio.onended = () => {
            if (selectedAyahIndex < currentSurahData.ayahs.length - 1) {
                setupAudioForAyah(selectedAyahIndex + 1);
                els.mainAudio.play();
            } else {
                stopAndResetAudio();
                updateHighlight(0);
            }
        };

        function switchTab(tabId) {
            stopAndResetAudio(); // إيقاف الصوت عند الانتقال لصفحة الإدارة
            document.getElementById('app-main').classList.add('hidden-screen');
            document.getElementById('user-login-screen').classList.add('hidden-screen');
            document.getElementById('admin-screen').classList.add('hidden-screen');
            document.getElementById(tabId).classList.remove('hidden-screen');
        }

        // --- دوال الإدارة ---
        function loginAdmin() {
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-pass').value;
            if(email === 'admin@samee3.com' && pass === '123456') {
                document.getElementById('admin-login-form').style.display = 'none';
                document.getElementById('dashboard-view').style.display = 'block';
                document.getElementById('login-error').style.display = 'none';
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        function saveAdminSettings() {
            const newTitle = document.getElementById('edit-site-title').value;
            if(newTitle.trim() !== '') {
                document.getElementById('site-main-title').innerText = newTitle;
                alert('تم التحديث بنجاح!');
            }
        }

        function logoutAdmin() {
            document.getElementById('dashboard-view').style.display = 'none';
            document.getElementById('admin-login-form').style.display = 'block';
        }

        window.onload = initializeApp;
    </script>
</body>
</html>
