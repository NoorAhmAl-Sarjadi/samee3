<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصحف سميع | المنصة القرآنية الشاملة</title>
    
    <!-- خطوط مجمع الملك فهد والرسم العثماني -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- مكتبات المشاركة والتحميل -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <style>
        /* --- التصميم الفاتح المريح --- */
        :root {
            --bg-main: #F4F9FE;         
            --navbar-bg: #FFFFFF;       
            --royal-blue: #0284C7;      
            --gold-premium: #D97706;    
            
            --mushaf-paper: #FCFBF8;    
            --mushaf-border: #0EA5E9;   
            --text-main: #0F172A;       
            --card-bg: #FFFFFF;         
            --border-light: #E2E8F0;
        }

        body { 
            font-family: 'Tajawal', sans-serif; 
            background-color: var(--bg-main); 
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%230284C7' fill-opacity='0.03'%3E%3Cpath d='M30 30l-5-5 5-5 5 5-5 5z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            margin: 0; 
            padding-bottom: 120px; 
            color: var(--text-main); 
            overflow-x: hidden; 
        }

        /* الإشعارات الذكية */
        #toast { visibility: hidden; min-width: 250px; max-width: 90%; background: var(--royal-blue); color: #fff; text-align: center; border-radius: 12px; padding: 16px 20px; position: fixed; z-index: 10000; left: 50%; bottom: 120px; transform: translateX(-50%); font-size: clamp(14px, 4vw, 18px); font-weight: 800; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        #toast.show { visibility: visible; animation: fadein 0.4s, fadeout 0.4s 2.5s; }
        @keyframes fadein { from { bottom: 90px; opacity: 0; } to { bottom: 120px; opacity: 1; } }
        @keyframes fadeout { from { bottom: 120px; opacity: 1; } to { bottom: 90px; opacity: 0; } }

        /* اللوحة الجانبية العائمة للتحميلات */
        .side-panel { position: fixed; top: 50%; right: 20px; transform: translateY(-50%) translateX(120%); width: 300px; max-width: 85vw; background: #fff; border: 2px solid var(--royal-blue); border-radius: 16px; padding: 20px; box-shadow: -5px 15px 30px rgba(0,0,0,0.1); z-index: 10001; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-align: center; }
        .side-panel.show { transform: translateY(-50%) translateX(0); }
        .side-panel h4 { margin: 0 0 15px 0; color: var(--royal-blue); font-size: 18px; font-weight: 800; }
        .progress-bar-bg { width: 100%; background: #E2E8F0; border-radius: 100px; height: 10px; overflow: hidden; margin-bottom: 10px; }
        .progress-bar-fill { height: 100%; background: var(--gold-premium); width: 0%; transition: width 0.3s; }
        .side-panel p { margin: 0 0 15px 0; font-weight: bold; color: var(--text-main); font-size: 14px; }
        .dl-now-btn { background: var(--royal-blue); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; width: 100%; font-family: inherit; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-bottom: 10px; }
        .dl-now-btn:hover { background: #0369A1; }
        .dl-cancel-btn { background: #FEE2E2; color: #DC2626; border: none; padding: 8px 20px; border-radius: 8px; width: 100%; font-family: inherit; font-size: 14px; font-weight: bold; cursor: pointer; }
        .dl-cancel-btn:hover { background: #FECACA; }
        .hidden { display: none !important; }

        /* شريط التنقل */
        .navbar { background: var(--navbar-bg); display: flex; justify-content: space-between; align-items: center; padding: 15px 60px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); position: sticky; top: 0; z-index: 100; border-bottom: 2px solid var(--royal-blue); }
        .navbar h1 { font-family: 'Aref Ruqaa', serif; margin: 0; font-size: clamp(28px, 6vw, 44px); color: var(--royal-blue); font-weight: 700; }
        .nav-btns { display: flex; gap: 15px; }
        .btn-nav { background: transparent; color: var(--royal-blue); border: 2px solid var(--royal-blue); padding: 8px 20px; border-radius: 8px; font-family: inherit; font-size: clamp(14px, 3vw, 16px); font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-nav:hover, .btn-nav.active { background: var(--royal-blue); color: #fff; }
        .btn-login { background: var(--gold-premium); color: #fff; border: none; padding: 8px 20px; border-radius: 8px; font-family: inherit; font-size: clamp(14px, 3vw, 16px); font-weight: 800; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(217, 119, 6, 0.2); }
        .btn-login:hover { filter: brightness(1.1); transform: translateY(-3px); }

        /* منطقة التحكم (الفلاتر) */
        .controls-section { background: var(--card-bg); padding: clamp(20px, 4vw, 40px) 20px; text-align: center; border-bottom: 1px solid var(--border-light); box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .filters-container { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; max-width: 1200px; margin: 0 auto; }
        .filter-select { padding: 12px 15px; font-size: clamp(14px, 3vw, 17px); font-family: inherit; border-radius: 10px; border: 2px solid var(--border-light); outline: none; width: 100%; max-width: 320px; font-weight: bold; background-color: #F8FAFC; color: var(--text-main); cursor: pointer; transition: 0.3s; }
        .filter-select:focus { border-color: var(--royal-blue); box-shadow: 0 0 10px rgba(2, 132, 199, 0.1); }

        /* شبكة السور */
        .container { max-width: 1400px; margin: 30px auto; padding: 0 15px; }
        .surah-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .surah-card { background: var(--card-bg); border: 1px solid var(--border-light); border-radius: 15px; padding: 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .surah-card:hover { transform: translateY(-5px); border-color: var(--royal-blue); box-shadow: 0 10px 25px rgba(2, 132, 199, 0.1); }
        .surah-info { display: flex; align-items: center; gap: 15px; }
        .surah-num { background: var(--bg-main); color: var(--royal-blue); width: 45px; height: 45px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 18px; border: 2px solid var(--royal-blue); }
        .surah-name { font-size: clamp(20px, 4vw, 26px); font-weight: bold; font-family: 'Amiri', serif; color: var(--text-main); margin: 0; }
        .play-icon { color: #CBD5E1; font-size: 24px; transition: 0.3s; }
        .surah-card:hover .play-icon { color: var(--royal-blue); }

        /* =========================================
           المصحف المدني - متجاوب تماماً مع الهاتف
           ========================================= */
        .mushaf-view { display: none; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .mushaf-toolbar { display: flex; justify-content: center; align-items: center; margin-bottom: 20px; }

        .mushaf-page-container { 
            max-width: 850px; 
            margin: 0 auto; 
            background: linear-gradient(to right, #e2dfd5 0%, #fcfbf8 4%, #fcfbf8 96%, #e2dfd5 100%);
            padding: clamp(15px, 3vw, 35px) clamp(10px, 3vw, 30px) clamp(20px, 4vw, 50px) clamp(10px, 3vw, 30px); 
            border-radius: 4px; 
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1); 
            position: relative;
            background-color: var(--mushaf-paper);
            box-sizing: border-box;
            width: 100%;
        }

        .mushaf-top-header {
            display: flex; justify-content: space-between; align-items: center; 
            padding: 0 5px 10px 5px;
            color: #d85c41; font-family: 'Aref Ruqaa', serif; 
            font-size: clamp(18px, 4vw, 28px); 
            text-shadow: 1px 1px 0px rgba(0,0,0,0.05);
        }
        
        .mushaf-ornate-border {
            background-color: var(--mushaf-border); 
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.15) 0, rgba(255,255,255,0.15) 2px, transparent 2px, transparent 6px);
            padding: clamp(8px, 2vw, 20px); 
            border: 2px solid #0284C7; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-radius: 8px;
        }

        .mushaf-inner-frame {
            background-color: var(--mushaf-paper); 
            padding: clamp(10px, 3vw, 25px); 
            border: 2px solid #222; box-shadow: inset 0 0 0 3px var(--mushaf-paper), inset 0 0 0 4px #222; 
            min-height: 50vh; 
            position: relative;
        }

        .surah-header-frame {
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 60"><path d="M20 30 Q 50 5, 200 5 T 380 30 Q 350 55, 200 55 T 20 30 Z" fill="none" stroke="%23333" stroke-width="2"/></svg>') no-repeat center center;
            background-size: 100% 100%; 
            height: clamp(50px, 10vw, 80px); 
            display: flex; justify-content: center; align-items: center; margin-bottom: 20px;
        }
        
        .mushaf-title { margin: 0; font-family: 'Aref Ruqaa', serif; font-size: clamp(24px, 5vw, 38px); color: #333; }
        .bismillah-text { font-family: 'Amiri Quran', serif; font-size: clamp(26px, 6vw, 40px); color: #111; text-align: center; margin-bottom: 20px; }

        .quran-area { 
            text-align: justify; text-align-last: center; direction: rtl; 
            font-family: 'Amiri Quran', 'Amiri', serif; 
            font-size: clamp(22px, 5vw, 38px); 
            color: #000; line-height: 2.1; 
        }
        
        .verse { cursor: pointer; padding: 2px 4px; transition: 0.3s; display: inline; border-radius: 6px; }
        .verse:hover { background-color: rgba(107, 167, 136, 0.15); }
        .verse-end { color: #d85c41; font-size: clamp(20px, 4vw, 30px); margin: 0 4px; user-select: none; font-weight: normal; font-family: 'Amiri', serif; }
        
        /* تأثير التظليل للآية النشطة أثناء الاستماع */
        .active-verse { background-color: rgba(2, 132, 199, 0.2); color: #000; box-shadow: 0 0 10px rgba(2, 132, 199, 0.25); border-radius: 6px; transition: background-color 0.3s ease; }

        .page-number-badge { text-align: center; margin-top: 15px; font-family: 'Aref Ruqaa', serif; font-size: clamp(18px, 4vw, 22px); color: var(--royal-blue); background: #fff; border: 2px solid var(--royal-blue); width: 60px; margin-left: auto; margin-right: auto; border-radius: 50%; padding: 3px 0; }

        .pagination-controls { display: flex; justify-content: space-between; align-items: center; max-width: 850px; margin: 25px auto 0; padding: 15px; background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border-light); gap: 10px; }
        .pagination-controls button { background: var(--bg-main); color: var(--royal-blue); border: 1px solid var(--royal-blue); padding: 8px 15px; font-size: clamp(14px, 3vw, 16px); }
        .pagination-controls button:hover { background: var(--royal-blue); color: #fff; }
        .pagination-controls button:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ========================================= */

        /* شريط التشغيل السفلي متجاوب */
        .sticky-player { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px); border-top: 1px solid var(--border-light); box-shadow: 0 -5px 30px rgba(0,0,0,0.08); display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; box-sizing: border-box; z-index: 999; min-height: 80px; }
        .player-info { display: flex; flex-direction: column; }
        .p-surah { font-size: clamp(16px, 4vw, 20px); font-weight: bold; color: var(--royal-blue); margin: 0 0 5px 0; font-family: 'Amiri', serif; }
        .p-reciter { font-size: clamp(12px, 3vw, 15px); color: var(--text-main); margin: 0; font-weight: bold; }
        .player-controls { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; justify-content: center; }
        audio { display: none; }
        
        .play-pause-btn { background: var(--royal-blue); color: #fff; width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; border: none; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(2, 132, 199, 0.3); }
        .play-pause-btn:hover { transform: scale(1.08); }
        
        .action-btn-sm { background: transparent; color: var(--text-main); border: 2px solid #CBD5E1; padding: 8px 15px; border-radius: 8px; font-family: inherit; font-size: clamp(12px, 3vw, 15px); font-weight: bold; cursor: pointer; transition: 0.3s; }
        .action-btn-sm:hover { background: var(--bg-main); border-color: var(--royal-blue); color: var(--royal-blue); }
        .dl-all-btn { background: var(--gold-premium); border-color: var(--gold-premium); color: white; }
        .dl-all-btn:hover { background: #B45309; border-color: #B45309; color: white; }

        /* الشاشات الجانبية والتفسير */
        .hidden-screen { display: none !important; }
        .auth-container { background: var(--card-bg); padding: clamp(20px, 5vw, 50px); border-radius: 20px; border: 1px solid var(--border-light); max-width: 450px; margin: 60px auto; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 90%; box-sizing: border-box; }
        .form-group { margin-bottom: 20px; text-align: right; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--royal-blue); font-size: 14px; }
        .form-group input { width: 100%; padding: 14px; border: 1px solid #CBD5E1; border-radius: 8px; font-family: inherit; font-size: 16px; background: #fff; color: var(--text-main); outline: none; box-sizing: border-box; transition: 0.3s; }
        .form-group input:focus { border-color: var(--royal-blue); }
        .auth-submit-btn { background: var(--royal-blue); color: #fff; padding: 14px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-family: inherit; font-weight: 800; transition: 0.3s; }
        .toggle-auth { margin-top: 20px; color: #64748B; font-size: 14px; font-weight: bold; }
        .toggle-auth span { color: var(--royal-blue); cursor: pointer; text-decoration: underline; margin-right: 5px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); display: none; justify-content: center; align-items: center; z-index: 1001; backdrop-filter: blur(5px); }
        .modal-content { background: var(--card-bg); padding: clamp(20px, 5vw, 35px); border-radius: 20px; width: 90%; max-width: 600px; text-align: center; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.2); border: 2px solid var(--royal-blue); max-height: 90vh; overflow-y: auto; }
        .close-modal { position: absolute; top: 10px; left: 10px; font-size: 24px; cursor: pointer; color: #64748B; background: none; border: none; transition: 0.3s; }
        
        .ayah-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 20px; }
        .modal-action-btn { padding: 12px; font-size: clamp(14px, 3vw, 16px); font-family: inherit; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        .action-play { background: #E0F2FE; color: var(--royal-blue); }
        .action-repeat { background: #FEF3C7; color: var(--gold-premium); }
        .action-tafsir { background: #D1FAE5; color: #059669; }
        .action-copy { background: #F1F5F9; color: var(--text-main); }
        .action-share { background: var(--royal-blue); color: #fff; grid-column: 1 / -1; }

        .tafsir-text-box { font-family: 'Amiri', serif; font-size: clamp(18px, 4vw, 24px); line-height: 2; text-align: justify; padding: 15px; background: #F8FAFC; border-radius: 8px; margin-top: 15px; max-height: 50vh; overflow-y: auto; color: var(--text-main); border: 1px solid #E2E8F0; }

        .lux-divider { border: 0; height: 2px; background: linear-gradient(to right, transparent, var(--royal-blue), transparent); margin: 40px auto 20px auto; width: 50%; opacity: 0.3; }
        .footer-signature { text-align: center; padding-bottom: 30px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; }
        .signature-name { font-size: clamp(16px, 4vw, 20px); font-weight: 800; color: var(--royal-blue); }

        /* =========================================
           تصميم الصورة المصدرة (التصميم الخرافي الجديد للآية)
           ========================================= */
        #export-canvas-container {
            position: fixed;
            left: -9999px;
            top: -9999px;
            width: 1080px;
            height: 1080px;
            background: linear-gradient(135deg, #0f172a 0%, #082f49 100%);
            color: #FFFFFF;
            display: flex;
            padding: 40px;
            box-sizing: border-box;
            direction: rtl;
            z-index: -100;
        }
        .export-inner-border {
            width: 100%;
            height: 100%;
            border: 4px solid #D97706; /* لون ذهبي */
            border-radius: 30px;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background-image: radial-gradient(circle at center, rgba(217, 119, 6, 0.1) 0%, transparent 70%);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        .export-header {
            font-family: 'Amiri Quran', serif;
            font-size: 35px;
            color: #FCD34D;
            opacity: 0.8;
        }
        .export-ayah {
            font-family: 'Amiri Quran', serif;
            font-size: 65px;
            line-height: 1.8;
            color: #FFFFFF;
            text-align: center;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            padding: 0 40px;
        }
        .export-surah-info {
            font-family: 'Aref Ruqaa', serif;
            font-size: 45px;
            color: #D97706;
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 40px;
            border-radius: 50px;
            border: 1px solid #D97706;
        }
        /* الضبط المطور لمنع تفكك الحروف العربية */
        .export-footer {
            font-family: 'Tajawal', sans-serif;
            font-size: 35px;
            font-weight: 800;
            color: #94A3B8;
            margin-top: 40px;
            direction: rtl;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        /* Media Queries لدعم الشاشات الصغيرة وتنسيق الشريط السفلي */
        @media (max-width: 768px) {
            .navbar { padding: 15px 20px; flex-direction: column; gap: 15px; }
            .sticky-player { flex-direction: column; padding: 15px; border-radius: 20px 20px 0 0; gap: 10px; }
            body { padding-bottom: 160px; }
            .player-info { text-align: center; }
            .player-controls { width: 100%; justify-content: center; }
            .side-panel { width: 90%; right: 5%; }
            #selected-ayah-preview { font-size: 22px !important; }
        }
    </style>
</head>
<body>

    <div id="toast">رسالة تنبيهية</div>

    <!-- اللوحة الجانبية للتحميلات -->
    <div id="side-progress-panel" class="side-panel">
        <h4 id="side-panel-title">جاري التجهيز...</h4>
        <div class="progress-bar-bg"><div id="side-panel-bar" class="progress-bar-fill"></div></div>
        <p id="side-panel-text">0%</p>
        <button id="side-panel-download-btn" class="dl-now-btn hidden">تنزيل الآن</button>
        <button id="side-panel-cancel-btn" class="dl-cancel-btn" onclick="hideSidePanel()">إغلاق / إلغاء</button>
    </div>

    <!-- الشريط العلوي -->
    <nav class="navbar">
        <h1 id="site-main-title">مصحف سَمِيع</h1>
        <div class="nav-btns">
            <button class="btn-nav active" onclick="switchTab('home-view')">الرئيسية</button>
            <button class="btn-login" onclick="switchTab('unified-login-view')" id="login-nav-btn">تسجيل الدخول</button>
        </div>
    </nav>

    <!-- منطقة الفلاتر -->
    <div class="controls-section" id="hero-filters">
        <div class="filters-container">
            <select class="filter-select" id="riwayah-select" onchange="filterRecitersByRiwayah()">
                <option value="hafs">رواية حفص عن عاصم</option>
                <option value="warsh">رواية ورش عن نافع</option>
                <option value="qalun">رواية قالون عن نافع</option>
                <option value="douri">رواية الدوري عن أبي عمرو</option>
                <option value="shubah">رواية شعبة عن عاصم</option>
                <option value="soussi">رواية السوسي عن أبي عمرو</option>
                <option value="hamza">رواية خلف عن حمزة</option>
            </select>
            
            <select class="filter-select" id="reciter-select" onchange="onReciterChange()">
                <option value="">جاري الاتصال بخوادم الصوت...</option>
            </select>

            <select class="filter-select" id="tafsir-select">
                <option value="ar.ibnkathir">تفسير ابن كثير</option>
                <option value="ar.saadi">تفسير السعدي</option>
                <option value="ar.tabari">تفسير الطبري</option>

            "الشمس", "الليل", "الضحى", "الشرح", "التين", "العلق", "القدر", "البينة", "الزلزلة", "العاديات", 
            "القارعة", "التكاثر", "العصر", "الهمزة", "الفيل", "قريش", "الماعون", "الكوثر", "الكافرون", "النصر",

        const JUZ_NAMES_AR = ["", "الأول", "الثاني", "الثالث", "الرابع", "الخامس", "السادس", "السابع", "الثامن", "التاسع", "العاشر", "الحادي عشر", "الثاني عشر", "الثالث عشر", "الرابع عشر", "الخامس عشر", "السادس عشر", "السابع عشر", "الثامن عشر", "التاسع عشر", "العشرون", "الحادي والعشرون", "الثاني والعشرون", "الثالث والعشرون", "الرابع والعشرون", "الخامس والعشرون", "السادس والعشرون", "السابع والعشرون", "الثامن والعشرون", "التاسع والعشرون", "الثلاثون"];

        let allMP3Reciters = []; 
        let globalSurahsList = []; 
        let currentAudioServer = ""; 
        let currentAvailableSurahs = []; 
        let currentSurahNumber = 1;
        let currentSurahData = null; 
        let currentSurahPages = [];
        let currentSurahPageIndex = 0;
        let rawAyahsTexts = []; 
        
        /* === متغيرات المزامنة المُحسنة === */
        let surahTimingStats = [];
        let currentPlayingAyahIndex = -1;
        let isPlaying = false;
        let startDelaySeconds = 0; // لحفظ وقت البسملة والاستعاذة
        
        let isRepeatingVerse = false;
        let selectedAyahIndex = 0;
        let isDownloadingOp = false;
        let isSignUpMode = false;
        
        const audioPlayer = document.getElementById('main-audio');
        const els = {
            riwayahSelect: document.getElementById('riwayah-select'),
            reciterSelect: document.getElementById('reciter-select'),
            surahGrid: document.getElementById('surah-grid-container'),
            quranDisplay: document.getElementById('quran-display'),
            bismillahHeader: document.getElementById('bismillah-header'),
            surahHeaderFrame: document.getElementById('surah-header-frame'),
            homeView: document.getElementById('home-view'),
            mushafView: document.getElementById('mushaf-view'),
            heroFilters: document.getElementById('hero-filters'),
            playBtnSticky: document.getElementById('play-btn-sticky'),
            sidePanel: document.getElementById('side-progress-panel'),
            sidePanelTitle: document.getElementById('side-panel-title'),
            sidePanelBar: document.getElementById('side-panel-bar'),
            sidePanelText: document.getElementById('side-panel-text'),
            sidePanelBtn: document.getElementById('side-panel-download-btn'),
            sidePanelCancel: document.getElementById('side-panel-cancel-btn')
        };

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        async function initializeApp() {
            try {
                const resMeta = await fetch('https://api.alquran.cloud/v1/meta');
                const metaData = await resMeta.json();
                globalSurahsList = metaData.data.surahs.references;
                
                const resMp3 = await fetch('https://www.mp3quran.net/api/v3/reciters?language=ar');
                const mp3Data = await resMp3.json();
                
                mp3Data.reciters.forEach(reciter => {
                    reciter.moshaf.forEach(m => {
                        let rType = 'hafs';
                        let mName = m.name;
                        if(mName.includes('ورش')) rType = 'warsh';
                        else if(mName.includes('قالون')) rType = 'qalun';
                        else if(mName.includes('الدوري')) rType = 'douri';
                        else if(mName.includes('شعبة')) rType = 'shubah';
                        else if(mName.includes('السوسي')) rType = 'soussi';
                        else if(mName.includes('حمزة') || mName.includes('خلف')) rType = 'hamza';

                        let cleanName = reciter.name;
                        if(m.name.includes('مرتل')) cleanName += ' (مرتل)';
                        else if(m.name.includes('مجود')) cleanName += ' (مجود)';
                        else if(reciter.moshaf.length > 1) {
                            let extra = m.name.replace(/حفص عن عاصم|رواية|بصيغة/g, '').trim();
                            if(extra) cleanName += ` (${extra})`;
                        }
                        cleanName = cleanName.replace(/\(\s*\)/g, '').trim(); 

                        allMP3Reciters.push({
                            id: reciter.id,
                            name: cleanName,
                            server: m.server,
                            surahList: m.surah_list.split(',').map(s => Number(s.trim())),
                            riwayah: rType
                        });
                    });
                });

                filterRecitersByRiwayah();
                renderSurahGrid();

            } catch (err) { els.surahGrid.innerHTML = '<p style="text-align:center; color:red;">خطأ في الاتصال بالخوادم.</p>'; }
        }

        function filterRecitersByRiwayah() {
            audioPlayer.pause();
            els.playBtnSticky.innerHTML = "⏵";
            const selectedRiwayah = els.riwayahSelect.value;
            els.reciterSelect.innerHTML = '';
            
            let minshawiIndex = -1;
            let count = 0;

            allMP3Reciters.forEach(r => {
                if(r.riwayah === selectedRiwayah) {
                    const option = new Option(r.name, r.server);
                    option.dataset.surahList = r.surahList.join(','); 
                    els.reciterSelect.add(option);
                    
                    if(r.name.includes("منشاوي") || r.name.includes("المنشاوي")) {
                        if (r.name.includes("مجود") || r.name.includes("المجود")) {
                            minshawiIndex = count;
                        } else if (minshawiIndex === -1) {
                            minshawiIndex = count; 
                        }
                    }
                    count++;
                }
            });

            if(count > 0) {
                if(minshawiIndex > -1) els.reciterSelect.selectedIndex = minshawiIndex;
                onReciterChange();
            } else {
                els.reciterSelect.add(new Option("عفواً، لا يوجد قراء لهذه الرواية", ""));
            }
        }

        function onReciterChange() {
            const selectedOption = els.reciterSelect.options[els.reciterSelect.selectedIndex];
            currentAudioServer = selectedOption.value;
            currentAvailableSurahs = selectedOption.dataset.surahList ? selectedOption.dataset.surahList.split(',').map(Number) : [];
            
            document.getElementById('player-reciter-txt').innerText = selectedOption.text.split(' (')[0];
            document.getElementById('player-surah-txt').innerText = "اختر سورة للتشغيل";
            
            audioPlayer.pause();
            els.playBtnSticky.innerHTML = "⏵";
            removeHighlight();
        }

        function renderSurahGrid() {
            els.surahGrid.innerHTML = '';
            globalSurahsList.forEach((s, index) => {
                const card = document.createElement('div');
                card.className = 'surah-card';
                card.onclick = () => loadSurahForReadingAndPlaying(s.number);
                const exactName = SURAH_NAMES_AR[index];
                card.innerHTML = `
                    <div class="surah-info">
                        <div class="surah-num">${s.number}</div>
                        <h3 class="surah-name">سورة ${exactName}</h3>
                    </div>
                    <div class="play-icon">⏵</div>
                `;
                els.surahGrid.appendChild(card);
            });
        }

        function padNumber(num) { return num.toString().padStart(3, '0'); }

        /* === خوارزمية التزامن المطورة (حل مشكلة القفز السريع والاستعاذة) === */
        function setupAyahSync() {
            if(!currentSurahData || !audioPlayer.duration || audioPlayer.duration === Infinity) return;
            
            let duration = audioPlayer.duration;
            let ayahs = currentSurahData.ayahs;
            
            // حساب وتجاهل وقت الاستعاذة والبسملة في بداية المقطع
            startDelaySeconds = 0;
            if (currentSurahNumber === 1) startDelaySeconds = 4.0; // الفاتحة: استعاذة فقط
            else if (currentSurahNumber === 9) startDelaySeconds = 4.0; // التوبة: استعاذة فقط
            else startDelaySeconds = 8.5; // باقي السور: استعاذة + بسملة
            
            let activeDuration = duration - startDelaySeconds;
            if (activeDuration < 0) activeDuration = duration;
            
            // زيادة وزن الوقفات (Pause) بين الآيات لمنع قفز التظليل قبل إنهاء الآية
            let basePauseWeight = 25; 
            let totalChars = rawAyahsTexts.reduce((acc, txt) => acc + txt.length + basePauseWeight, 0);
            
            let currentTimeAcc = startDelaySeconds;
            
            surahTimingStats = rawAyahsTexts.map((txt, i) => {
                let weight = txt.length + basePauseWeight;
                let ratio = weight / totalChars;
                
                // نعطي الآية وقتاً كاملاً لضمان عدم القفز
                let ayahDur = activeDuration * ratio; 
                
                let start = currentTimeAcc;
                let end = currentTimeAcc + ayahDur;
                currentTimeAcc = end;
                
                return { start: start, end: end, index: i, page: ayahs[i].page };
            });
        }

        audioPlayer.onloadedmetadata = () => {
            setupAyahSync();
        };

        audioPlayer.ontimeupdate = () => {
            if(!isPlaying) return;
            
            if (surahTimingStats.length === 0) setupAyahSync();
            if (surahTimingStats.length === 0) return;
            
            let ct = audioPlayer.currentTime;
            
            // 1. فحص توقيت الاستعاذة والبسملة: لا تظهر أي تظليل حتى يبدأ في الآية الأولى الفعليّة
            if (ct < surahTimingStats[0].start) {
                if (currentPlayingAyahIndex !== -1) {
                    removeHighlight();
                    currentPlayingAyahIndex = -1;
                }
                return; // إيقاف تنفيذ الباقي حتى ينتهي وقت الاستعاذة/البسملة
            }
            
            // 2. تكرار الآية المخصص
            if (isRepeatingVerse) {
                let targetTiming = surahTimingStats[selectedAyahIndex];
                if (targetTiming && ct >= targetTiming.end - 0.2) {
                    audioPlayer.currentTime = targetTiming.start;
                    ct = targetTiming.start; 
                }
            }
            
            // 3. تحديد الآية النشطة وإبرازها
            let activeAyah = surahTimingStats.find(a => ct >= a.start && ct <= a.end);
            
            if(activeAyah && activeAyah.index !== currentPlayingAyahIndex) {
                currentPlayingAyahIndex = activeAyah.index;
                
                let activePage = activeAyah.page;
                let displayedPage = currentSurahPages[currentSurahPageIndex][0].page;
                
                if(activePage !== displayedPage) {
                    let targetPageIndex = currentSurahPages.findIndex(p => p[0].page === activePage);
                    if(targetPageIndex !== -1) {
                        currentSurahPageIndex = targetPageIndex;
                        renderCurrentPage();
                        document.querySelector('.mushaf-page-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                }
                
                applyHighlight(currentPlayingAyahIndex);
            }
        };

        async function loadSurahForReadingAndPlaying(surahNum) {
            if(!currentAvailableSurahs.includes(Number(surahNum))) {
                showToast("عذراً، هذا القارئ لم يسجل هذه السورة.");
                return;
            }

            currentSurahNumber = surahNum;
            const exactSurahName = SURAH_NAMES_AR[surahNum - 1]; 
            document.getElementById('player-surah-txt').innerText = `سورة ${exactSurahName}`;
            
            const audioUrl = currentAudioServer + padNumber(surahNum) + '.mp3';
            audioPlayer.src = audioUrl;
            audioPlayer.play();
            isPlaying = true;
            els.playBtnSticky.innerHTML = "⏸";
            
            surahTimingStats = [];
            currentPlayingAyahIndex = -1;
            removeHighlight();

            els.homeView.style.display = 'none';
            els.heroFilters.style.display = 'none';
            els.mushafView.style.display = 'block';
            document.getElementById('pagination-controls').style.display = 'none';
            els.quranDisplay.innerHTML = 'جاري تحميل النص...';

            try {
                let textEdition = 'quran-uthmani';
                if(els.riwayahSelect.value !== 'hafs') textEdition = 'quran-simple'; 

                const quranRes = await fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/${textEdition}`);
                currentSurahData = (await quranRes.json()).data;
                
                rawAyahsTexts = [];
                let pagesMap = {};
                const bismillahExact = "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ";

                currentSurahData.ayahs.forEach((ayah, index) => {
                    let text = ayah.text;
                    if (index === 0 && currentSurahNumber !== 1 && currentSurahNumber !== 9) {
                        if (text.startsWith(bismillahExact)) text = text.substring(bismillahExact.length).trim();
                        else text = text.replace(/^بِسْمِ [^\s]+ [^\s]+ [^\s]+\s*/g, '');
                        if(text.startsWith('و ')) text = text.substring(2);
                    }
                    rawAyahsTexts.push(text);
                    ayah.globalIndex = index;
                    ayah.cleanText = text;
                    if(!pagesMap[ayah.page]) pagesMap[ayah.page] = [];
                    pagesMap[ayah.page].push(ayah);
                });

                currentSurahPages = Object.keys(pagesMap).map(Number).sort((a,b) => a-b).map(p => pagesMap[p]);
                currentSurahPageIndex = 0;
                renderCurrentPage();
                
                setupAyahSync();

            } catch (err) { els.quranDisplay.innerHTML = "حدث خطأ في تحميل السورة."; }
        }

        function renderCurrentPage() {
            els.quranDisplay.innerHTML = '';
            const pageAyahs = currentSurahPages[currentSurahPageIndex];
            const exactSurahName = SURAH_NAMES_AR[currentSurahNumber - 1];

            const firstAyah = pageAyahs[0];
            const juzNum = firstAyah.juz;
            document.getElementById('surah-name-header').innerText = `سورة ${exactSurahName}`;
            document.getElementById('juz-name-header').innerText = `الجزء ${JUZ_NAMES_AR[juzNum]}`;

            if (currentSurahPageIndex === 0) {
                els.surahHeaderFrame.style.display = 'flex';
                document.getElementById('mushaf-surah-title').innerText = `سورة ${exactSurahName}`;
                if (currentSurahNumber !== 1 && currentSurahNumber !== 9) els.bismillahHeader.style.display = 'block';
                else els.bismillahHeader.style.display = 'none';
            } else {
                els.surahHeaderFrame.style.display = 'none';
                els.bismillahHeader.style.display = 'none';
            }

            pageAyahs.forEach((ayah) => {
                const span = document.createElement('span');
                span.className = 'verse';
                span.id = `verse-span-${ayah.globalIndex}`;
                span.innerHTML = `${ayah.cleanText} <span class="verse-end">﴿${ayah.numberInSurah}﴾</span> `;
                span.onclick = () => { openActionModal(ayah.globalIndex); };
                els.quranDisplay.appendChild(span);
            });

            const paginationDiv = document.getElementById('pagination-controls');
            paginationDiv.style.display = currentSurahPages.length > 1 ? 'flex' : 'none';
            document.getElementById('prev-page-btn').disabled = (currentSurahPageIndex === 0);
            document.getElementById('next-page-btn').disabled = (currentSurahPageIndex === currentSurahPages.length - 1);
            
            let pageBadge = document.getElementById('page-number-display');
            if(!pageBadge) {
                pageBadge = document.createElement('div');
                pageBadge.id = 'page-number-display';
                pageBadge.className = 'page-number-badge';
                document.querySelector('.mushaf-inner-frame').appendChild(pageBadge);
            }
            pageBadge.innerText = pageAyahs[0].page;
        }

        function togglePlayState() {
            if(!audioPlayer.src) return showToast("الرجاء اختيار سورة للتشغيل.");
            if(audioPlayer.paused) {
                audioPlayer.play();
                isPlaying = true;
                els.playBtnSticky.innerHTML = "⏸";
            } else {
                audioPlayer.pause();
                isPlaying = false;
                els.playBtnSticky.innerHTML = "⏵";
            }
        }

        audioPlayer.onended = () => { 
            els.playBtnSticky.innerHTML = "⏵"; 
            isPlaying = false; 
            removeHighlight();
            currentPlayingAyahIndex = -1;
        };

        function applyHighlight(index) {
            removeHighlight();
            const el = document.getElementById(`verse-span-${index}`);
            if(el) el.classList.add('active-verse');
        }
        function removeHighlight() { document.querySelectorAll('.verse').forEach(el => el.classList.remove('active-verse')); }

        function openActionModal(index) {
            selectedAyahIndex = index;
            document.getElementById('selected-ayah-preview').innerText = `﴿ ${rawAyahsTexts[index]} ﴾`;
            document.getElementById('action-modal').style.display = 'flex';
        }

        function closeModals() {
            document.getElementById('action-modal').style.display = 'none';
            document.getElementById('tafsir-modal').style.display = 'none';
        }

        /* === برمجة تشغيل الآية بصوت القارئ الحالي نفسه === */
        function playSpecificAyahModal() {
            closeModals();
            
            if (surahTimingStats.length === 0) setupAyahSync();
            
            if (surahTimingStats.length > 0) {
                showToast("جاري تشغيل الآية بصوت القارئ الحالي...");
                const ayahTiming = surahTimingStats[selectedAyahIndex];
                audioPlayer.currentTime = ayahTiming.start;
                audioPlayer.play();
                isPlaying = true;
                els.playBtnSticky.innerHTML = "⏸";
            } else {
                showToast("جاري تجهيز المقطع، يرجى المحاولة بعد قليل.");
            }
        }

        function toggleRepeatAyah() {
            isRepeatingVerse = !isRepeatingVerse;
            const btn = document.getElementById('btn-repeat-ayah');
            if(isRepeatingVerse) {
                btn.style.background = "var(--gold-premium)";
                btn.style.color = "#fff";
                playSpecificAyahModal(); 
            } else {
                btn.style.background = "#FEF3C7";
                btn.style.color = "var(--gold-premium)";
            }
        }

        function copyAyahText() {
            const exactSurahName = SURAH_NAMES_AR[currentSurahNumber - 1];
            const textToCopy = `﴿ ${rawAyahsTexts[selectedAyahIndex]} ﴾\n[سورة ${exactSurahName} - آية ${currentSurahData.ayahs[selectedAyahIndex].numberInSurah}]`;
            navigator.clipboard.writeText(textToCopy).then(() => { closeModals(); showToast("تم نسخ الآية بنجاح!"); });
        }

        async function openTafsirModal() {
            document.getElementById('action-modal').style.display = 'none';
            document.getElementById('tafsir-modal').style.display = 'flex';
            const tafsirBox = document.getElementById('tafsir-modal-text');
            const tafsirId = document.getElementById('tafsir-select').value;
            const tafsirName = document.getElementById('tafsir-select').options[document.getElementById('tafsir-select').selectedIndex].text;
            document.getElementById('tafsir-modal-title').innerText = `${tafsirName}`;
            tafsirBox.innerHTML = "جاري جلب التفسير...";

            const globalNum = currentSurahData.ayahs[selectedAyahIndex].number;
            try {
                const res = await fetch(`https://api.alquran.cloud/v1/ayah/${globalNum}/${tafsirId}`);
                const data = await res.json();
                tafsirBox.innerHTML = data.data.text;
            } catch(e) { tafsirBox.innerHTML = "حدث خطأ في جلب التفسير."; }
        }

        function nextPage() {
            if(currentSurahPageIndex < currentSurahPages.length - 1) {
                currentSurahPageIndex++;
                renderCurrentPage();
                document.querySelector('.mushaf-page-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }
        function prevPage() {
            if(currentSurahPageIndex > 0) {
                currentSurahPageIndex--;
                renderCurrentPage();
                document.querySelector('.mushaf-page-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function closeMushafView() {
            els.mushafView.style.display = 'none';
            els.homeView.style.display = 'block';
            els.heroFilters.style.display = 'block';
            audioPlayer.pause();
            els.playBtnSticky.innerHTML = "⏵";
            removeHighlight();
        }

        // ==========================================
        // وظائف اللوحة الجانبية (تنزيل الصورة والصوت)
        // ==========================================
        
        function initSidePanel(title) {
            els.sidePanelTitle.innerText = title;
            els.sidePanelBar.style.width = '0%';
            els.sidePanelText.innerText = '0%';
            els.sidePanelBtn.classList.add('hidden');
            els.sidePanelCancel.innerText = 'إلغاء';
            els.sidePanel.classList.add('show');
            isDownloadingOp = true;
        }
        function updateSidePanel(percent, text) {
            els.sidePanelBar.style.width = percent + '%';
            els.sidePanelText.innerText = text;
        }
        function finishSidePanel(blobUrl, fileName) {
            els.sidePanelBar.style.width = '100%';
            els.sidePanelText.innerText = '100% - اكتمل التجهيز';
            els.sidePanelBtn.classList.remove('hidden');
            els.sidePanelCancel.innerText = 'إغلاق';
            els.sidePanelBtn.onclick = () => {
                saveAs(blobUrl, fileName);
                hideSidePanel();
            };
            isDownloadingOp = false;
        }
        function hideSidePanel() {
            els.sidePanel.classList.remove('show');
            isDownloadingOp = false;
        }

        async function downloadSingleSurahPanel() {
            if(!currentAudioServer) return showToast("اختر سورة أولاً.");
            if(isDownloadingOp) return showToast("عملية تحميل جارية...");
            initSidePanel("تنزيل السورة (صوت)");
            
            try {
                const url = currentAudioServer + padNumber(currentSurahNumber) + '.mp3';
                updateSidePanel(50, "جاري سحب الملف...");
                const response = await fetch(url);
                const blob = await response.blob();
                const exactSurahName = SURAH_NAMES_AR[currentSurahNumber - 1];
                finishSidePanel(blob, `Surah_${padNumber(currentSurahNumber)}_${exactSurahName}.mp3`);
            } catch(e) {
                els.sidePanelText.innerText = "فشل التحميل!";
                isDownloadingOp = false;
            }
        }

        async function downloadFullMushafZipPanel() {
            if(!currentAudioServer || currentAvailableSurahs.length === 0) return showToast("اختر قارئ أولاً.");
            if(isDownloadingOp) return showToast("عملية تحميل جارية...");
            initSidePanel("تجهيز المصحف (ZIP)");
            
            const zip = new JSZip();
            let downloadedCount = 0;
            let totalSurahs = currentAvailableSurahs.length;

            try {
                for (let i = 0; i < totalSurahs; i++) {
                    if(!isDownloadingOp) throw new Error("تم الإلغاء");
                    let surahNum = currentAvailableSurahs[i];
                    let url = currentAudioServer + padNumber(surahNum) + '.mp3';
                    let exactSurahName = SURAH_NAMES_AR[surahNum-1];
                    
                    const response = await fetch(url);
                    if (!response.ok) throw new Error("فشل الاتصال");
                    const blob = await response.blob();
                    zip.file(`Surah_${padNumber(surahNum)}_${exactSurahName}.mp3`, blob);
                    
                    downloadedCount++;
                    let pct = Math.floor((downloadedCount / totalSurahs) * 80);
                    updateSidePanel(pct, `تم سحب ${downloadedCount} من ${totalSurahs} سورة`);
                }

                updateSidePanel(90, "جاري الضغط...");
                const content = await zip.generateAsync({ type: "blob" });
                
                const reciterCleanName = document.getElementById('player-reciter-txt').innerText;
                finishSidePanel(content, `Mushaf_${reciterCleanName}.zip`);
            } catch(e) {
                if(e.message !== "تم الإلغاء") els.sidePanelText.innerText = "فشل التحميل!";
            }
        }

        /* === برمجة إنشاء التصميم الخرافي المخفي ومشاركته (مع حل مشكلة الحروف) === */
        function shareAyahImagePanel() {
            closeModals();
            if(isDownloadingOp) return showToast("عملية جارية بالفعل...");
            initSidePanel("تصميم صورة الآية");
            
            const exportDiv = document.createElement('div');
            exportDiv.id = 'export-canvas-container';
            
            const exactSurahName = SURAH_NAMES_AR[currentSurahNumber - 1];
            const ayahNum = currentSurahData.ayahs[selectedAyahIndex].numberInSurah;
            const ayahText = rawAyahsTexts[selectedAyahIndex];

            // استخدام وسوم <bdi> لضمان عدم تفكك الحروف العربية في التذييل
            exportDiv.innerHTML = `
                <div class="export-inner-border">
                    <div class="export-header">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
                    <div class="export-ayah">﴿ ${ayahText} ﴾</div>
                    <div class="export-surah-info">سورة ${exactSurahName} ❖ آية ${ayahNum}</div>
                    <div class="export-footer">
                        <bdi style="color:#FFFFFF;">مصحف سَمِيع</bdi>
                        <span style="color:#D97706; margin:0 15px;">❖</span>
                        <bdi style="color:#FFFFFF;">Samee3 Quran</bdi>
                    </div>
                </div>
            `;
            document.body.appendChild(exportDiv);

            updateSidePanel(40, "جاري إنشاء التصميم الاحترافي...");
            
            setTimeout(() => {
                html2canvas(exportDiv, { 
                    scale: 2, 
                    backgroundColor: null,
                    useCORS: true
                }).then(canvas => {
                    updateSidePanel(80, "تجهيز الصورة...");
                    canvas.toBlob(blob => {
                        finishSidePanel(blob, `Ayah_${exactSurahName}_${ayahNum}.png`);
                        document.body.removeChild(exportDiv);
                    });
                }).catch(err => {
                    els.sidePanelText.innerText = "فشل التصميم!";
                    isDownloadingOp = false;
                    document.body.removeChild(exportDiv);
                });
            }, 800); 
        }

        // ==========================================

        function switchTab(tabId) {
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('mushaf-view').style.display = 'none';
            document.getElementById('hero-filters').style.display = 'none';
            document.getElementById('unified-login-view').classList.add('hidden-screen');
            document.getElementById('admin-view').classList.add('hidden-screen');
            
            if (tabId === 'home-view') {
                document.getElementById('home-view').style.display = 'block';
                document.getElementById('hero-filters').style.display = 'block';
            } else {
                document.getElementById(tabId).classList.remove('hidden-screen');
            }
            audioPlayer.pause();
            els.playBtnSticky.innerHTML = "⏵";
        }

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            const title = document.getElementById('auth-title');
            const btn = document.getElementById('auth-submit-btn');
            const nameGroup = document.getElementById('name-group');
            const toggleText = document.getElementById('toggle-text');

            if(isSignUpMode) {
                title.innerText = "إنشاء حساب جديد";
                btn.innerText = "إنشاء الحساب وحفظ التقدم";
                nameGroup.style.display = "block";
                toggleText.innerHTML = `لديك حساب بالفعل؟ <span onclick="toggleAuthMode()">تسجيل الدخول</span>`;
            } else {
                title.innerText = "بوابة الدخول";
                btn.innerText = "تسجيل الدخول";
                nameGroup.style.display = "none";
                toggleText.innerHTML = `ليس لديك حساب؟ <span onclick="toggleAuthMode()">إنشاء حساب جديد</span>`;
            }
        }

        function handleUnifiedLogin() {
            const email = document.getElementById('user-email').value;
            const pass = document.getElementById('user-pass').value;
            if(email === 'admin@samee3.com' && pass === '123456') {
                showToast("تم الدخول بصلاحيات الإدارة");
                document.getElementById('user-email').value = '';
                document.getElementById('user-pass').value = '';
                switchTab('admin-view');
            } else {
                if(isSignUpMode) showToast("تم إنشاء الحساب بنجاح. سيتم حفظ تقدمك تلقائياً.");
                else showToast("تم تسجيل الدخول كمستخدم.");
                localStorage.setItem('userLoggedIn', 'true');
                document.getElementById('login-nav-btn').innerText = "تم الدخول";
                switchTab('home-view');
            }
        }

        function saveAdminSettings() {
            const newTitle = document.getElementById('edit-site-title').value;
            if(newTitle.trim() !== '') document.getElementById('site-main-title').innerText = newTitle;
            showToast('تم تطبيق التعديلات بنجاح!');
        }

        function logoutSystem() {
            localStorage.removeItem('userLoggedIn');
            document.getElementById('login-nav-btn').innerText = "تسجيل الدخول";
            showToast("تم تسجيل الخروج");
            switchTab('home-view');
        }

        window.onload = initializeApp;
    </script>
</body>
</html>
