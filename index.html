<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصحف سميع | واجهة زجاجية متطورة</title>
    
    <!-- خطوط مجمع الملك فهد للرسم العثماني -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
    
    <!-- مكتبات المشاركة والتحميل -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <style>
        /* --- ألوان وتأثيرات Apple Liquid Glass --- */
        :root {
            --ios-bg: #F2F2F7;
            --ios-glass: rgba(255, 255, 255, 0.75);
            --ios-glass-border: rgba(255, 255, 255, 0.8);
            --ios-blue: #007AFF;
            --ios-green: #34C759;
            --ios-text: #1C1C1E;
            --ios-text-secondary: #8E8E93;
            
            /* ألوان المصحف المدني */
            --mushaf-paper: #FAF7F0;    
            --mushaf-green: #064E3B;    
            --mushaf-gold: #B48608;
        }

        body { 
            font-family: 'Tajawal', sans-serif; 
            background-color: var(--ios-bg); 
            margin: 0; 
            padding-bottom: 120px; 
            color: var(--ios-text); 
            position: relative;
            overflow-x: hidden;
        }
        
        /* تأثيرات الخلفية الزجاجية (Orbs) */
        .bg-orb { position: fixed; border-radius: 50%; filter: blur(80px); z-index: -1; opacity: 0.5; }
        .orb-1 { width: 400px; height: 400px; background: #007AFF; top: -100px; right: -100px; }
        .orb-2 { width: 350px; height: 350px; background: #34C759; bottom: 100px; left: -50px; }
        .orb-3 { width: 300px; height: 300px; background: #FF9500; top: 40%; right: 20%; opacity: 0.3; }

        /* الإشعارات الذكية */
        #toast { visibility: hidden; min-width: 300px; background: rgba(28, 28, 30, 0.9); backdrop-filter: blur(10px); color: #fff; text-align: center; border-radius: 100px; padding: 14px 25px; position: fixed; z-index: 10000; left: 50%; bottom: 120px; transform: translateX(-50%); font-size: 16px; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        #toast.show { visibility: visible; animation: fadein 0.4s, fadeout 0.4s 2.5s; }
        @keyframes fadein { from { bottom: 90px; opacity: 0; } to { bottom: 120px; opacity: 1; } }
        @keyframes fadeout { from { bottom: 120px; opacity: 1; } to { bottom: 90px; opacity: 0; } }

        /* شريط التنقل (Apple Navbar) */
        .navbar { background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; box-shadow: 0 2px 20px rgba(0, 0, 0, 0.04); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--ios-glass-border); }
        
        .navbar h1 { font-family: 'Aref Ruqaa', serif; margin: 0; font-size: 40px; color: var(--ios-blue); font-weight: 700; letter-spacing: -1px; }
        
        .nav-btns { display: flex; gap: 15px; }
        .btn-nav { background: var(--ios-glass); color: var(--ios-blue); border: 1px solid var(--ios-glass-border); padding: 10px 20px; border-radius: 100px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .btn-nav:hover, .btn-nav.active { background: var(--ios-blue); color: #fff; }
        
        .btn-login { background: var(--ios-blue); color: #fff; border: none; padding: 10px 25px; border-radius: 100px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3); }
        .btn-login:hover { transform: translateY(-2px); filter: brightness(1.1); }

        /* منطقة التحكم (الفلاتر) */
        .controls-section { padding: 30px 20px; text-align: center; }
        .filters-container { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; max-width: 1200px; margin: 0 auto; background: var(--ios-glass); backdrop-filter: blur(20px); padding: 20px; border-radius: 24px; border: 1px solid var(--ios-glass-border); box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
        
        .filter-select { padding: 14px 20px; font-size: 16px; font-family: inherit; border-radius: 14px; border: 1px solid rgba(0,0,0,0.05); outline: none; width: 100%; max-width: 280px; font-weight: 700; background-color: rgba(255,255,255,0.8); color: var(--ios-text); cursor: pointer; transition: 0.3s; appearance: none; }
        .filter-select:focus { border-color: var(--ios-blue); box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2); }

        /* شبكة السور */
        .container { max-width: 1300px; margin: 30px auto; padding: 0 20px; }
        .surah-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        
        .surah-card { background: var(--ios-glass); backdrop-filter: blur(20px); border: 1px solid var(--ios-glass-border); border-radius: 24px; padding: 25px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 8px 20px rgba(0,0,0,0.03); }
        .surah-card:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 15px 30px rgba(0,0,0,0.08); border-color: rgba(0, 122, 255, 0.3); }
        
        .surah-info { display: flex; align-items: center; gap: 15px; }
        .surah-num { background: rgba(0, 122, 255, 0.1); color: var(--ios-blue); width: 45px; height: 45px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-weight: 800; font-size: 18px; }
        .surah-name { font-size: 24px; font-weight: bold; font-family: 'Amiri', serif; color: var(--ios-text); margin: 0; }
        .play-icon { color: var(--ios-text-secondary); font-size: 24px; transition: 0.3s; }
        .surah-card:hover .play-icon { color: var(--ios-blue); }

        /* =========================================
           المصحف المدني الموثق (Madani Layout)
           ========================================= */
        .mushaf-view { display: none; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .mushaf-toolbar { display: flex; justify-content: center; align-items: center; margin-bottom: 20px; }
        
        /* إطار صفحة المصحف الفعلي */
        .mushaf-page-container { 
            max-width: 800px; 
            margin: 0 auto; 
            background-color: var(--mushaf-paper); 
            padding: 60px 50px; 
            border-radius: 16px; 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1); 
            position: relative;
            border: 2px solid var(--mushaf-gold);
        }
        
        /* الزخرفة والإطار المزدوج */
        .mushaf-page-container::after { 
            content: ''; position: absolute; top: 12px; left: 12px; right: 12px; bottom: 12px; 
            border: 1px solid var(--mushaf-green); pointer-events: none; opacity: 0.6;
        }

        /* ترويسة السورة */
        .surah-header-frame {
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 60"><path d="M20 30 Q 50 5, 200 5 T 380 30 Q 350 55, 200 55 T 20 30 Z" fill="none" stroke="%23B48608" stroke-width="2"/></svg>') no-repeat center center;
            background-size: 100% 100%;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
            z-index: 5;
        }
        .mushaf-title { margin: 0; font-family: 'Aref Ruqaa', serif; font-size: 38px; color: var(--mushaf-green); }
        
        /* البسملة */
        .bismillah-text {
            font-family: 'Amiri Quran', serif;
            font-size: 42px;
            color: var(--ios-text);
            text-align: center;
            margin-bottom: 25px;
            position: relative;
            z-index: 5;
        }

        /* تنسيق الآيات */
        .quran-area { 
            text-align: justify; 
            text-align-last: center; 
            direction: rtl; 
            min-height: 500px; 
            position: relative; 
            z-index: 5; 
            font-family: 'Amiri Quran', 'Amiri', serif; 
            font-size: 38px; 
            color: #000; 
            line-height: 2.2;
        }
        
        .verse { cursor: pointer; padding: 2px 4px; transition: 0.3s ease; display: inline; border-radius: 8px; }
        .verse:hover { background-color: rgba(0, 122, 255, 0.1); }
        .verse-end { color: var(--mushaf-gold); font-size: 30px; margin: 0 6px; user-select: none; font-weight: normal; font-family: 'Amiri', serif; }
        
        /* تأثير التظليل للآية الشغالة (Apple Style Highlight) */
        .active-verse { 
            background-color: rgba(52, 199, 89, 0.15); /* أخضر تفاحي شفاف */
            color: var(--mushaf-green);
            box-shadow: 0 0 10px rgba(52, 199, 89, 0.2);
        }

        /* أزرار تقليب الصفحات */
        .pagination-controls {
            display: flex; justify-content: space-between; align-items: center;
            max-width: 800px; margin: 25px auto 0; padding: 15px 25px;
            background: var(--ios-glass); backdrop-filter: blur(20px);
            border-radius: 100px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid var(--ios-glass-border);
        }
        .pagination-controls button { background: rgba(0,122,255,0.1); border: none; }
        .pagination-controls button:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ========================================= */

        /* شريط التشغيل السفلي الزجاجي */
        .sticky-player { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 800px; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(30px) saturate(180%); border: 1px solid var(--ios-glass-border); border-radius: 100px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; padding: 10px 30px; z-index: 999; }
        
        .player-info { display: flex; flex-direction: column; }
        .p-surah { font-size: 18px; font-weight: 800; color: var(--ios-text); margin: 0; }
        .p-reciter { font-size: 14px; color: var(--ios-text-secondary); margin: 0; }
        
        .player-controls { display: flex; gap: 15px; align-items: center; }
        audio { display: none; }
        
        .play-pause-btn { background: var(--ios-blue); color: #fff; width: 55px; height: 55px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; border: none; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(0, 122, 255, 0.3); }
        .play-pause-btn:hover { transform: scale(1.05); }
        
        .action-btn-sm { background: rgba(0,0,0,0.04); color: var(--ios-text); border: none; padding: 12px 20px; border-radius: 100px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .action-btn-sm:hover { background: rgba(0,0,0,0.08); }
        .dl-all-btn { background: rgba(52, 199, 89, 0.15); color: var(--ios-green); }
        .dl-all-btn:hover { background: rgba(52, 199, 89, 0.25); }

        /* شاشات الدخول */
        .hidden-screen { display: none !important; }
        .auth-container { background: var(--ios-glass); backdrop-filter: blur(25px); padding: 50px; border-radius: 30px; border: 1px solid var(--ios-glass-border); max-width: 450px; margin: 60px auto; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 20px; text-align: right; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 700; color: var(--ios-text-secondary); font-size: 14px; }
        .form-group input { width: 100%; padding: 16px; border: 1px solid rgba(0,0,0,0.1); border-radius: 16px; font-family: inherit; font-size: 16px; background: rgba(255,255,255,0.9); color: var(--ios-text); outline: none; box-sizing: border-box; transition: 0.3s; }
        .form-group input:focus { border-color: var(--ios-blue); box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1); }
        .auth-submit-btn { background: var(--ios-blue); color: #fff; padding: 16px; font-size: 18px; border: none; border-radius: 16px; cursor: pointer; width: 100%; font-family: inherit; font-weight: 800; transition: 0.3s; }
        .auth-submit-btn:hover { background: #005bb5; }
        
        /* النوافذ المنبثقة (Modals - iOS Style) */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); display: none; justify-content: center; align-items: flex-end; z-index: 1001; backdrop-filter: blur(5px); padding-bottom: 30px; }
        .modal-content { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(40px); padding: 30px; border-radius: 30px; width: 90%; max-width: 600px; text-align: center; position: relative; box-shadow: 0 30px 60px rgba(0,0,0,0.2); border: 1px solid var(--ios-glass-border); animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .close-modal { position: absolute; top: 20px; left: 20px; font-size: 24px; cursor: pointer; color: var(--ios-text-secondary); background: rgba(0,0,0,0.05); width: 40px; height: 40px; border-radius: 50%; border: none; transition: 0.3s; display: flex; justify-content: center; align-items: center; }
        .close-modal:hover { background: rgba(0,0,0,0.1); }
        
        .ayah-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 25px; }
        .modal-action-btn { padding: 15px; font-size: 16px; font-family: inherit; font-weight: 800; border-radius: 16px; border: none; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        /* أزرار الآية المخصصة */
        .action-play { background: rgba(0, 122, 255, 0.15); color: var(--ios-blue); }
        .action-repeat { background: rgba(255, 149, 0, 0.15); color: #FF9500; }
        .action-tafsir { background: rgba(52, 199, 89, 0.15); color: var(--ios-green); }
        .action-copy { background: rgba(0, 0, 0, 0.05); color: var(--ios-text); }
        .action-share { background: var(--ios-text); color: #fff; grid-column: 1 / -1; }
        .modal-action-btn:hover { filter: brightness(0.95); transform: scale(0.98); }

        .tafsir-text-box { font-family: 'Amiri', serif; font-size: 24px; line-height: 2; text-align: justify; padding: 20px; background: rgba(0,0,0,0.03); border-radius: 16px; margin-top: 20px; max-height: 400px; overflow-y: auto; color: var(--ios-text); border: 1px solid rgba(0,0,0,0.05); }

        /* نافذة التنزيل الشامل */
        .dl-progress-container { width: 100%; background: rgba(0,0,0,0.05); border-radius: 100px; margin-top: 25px; overflow: hidden; height: 12px; }
        .dl-progress-bar { height: 100%; background: var(--ios-blue); width: 0%; transition: width 0.3s ease; border-radius: 100px; }
        
        .footer-signature { text-align: center; padding: 50px 0; font-size: 16px; font-weight: 800; color: var(--ios-text-secondary); }
    </style>
</head>
<body>

    <!-- مؤثرات الخلفية الزجاجية -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <div id="toast">رسالة تنبيهية</div>

    <nav class="navbar">
        <h1 id="site-main-title">مصحف سَمِيع</h1>
        <div class="nav-btns">
            <button class="btn-nav active" onclick="switchTab('home-view')">الرئيسية</button>
            <button class="btn-login" onclick="switchTab('unified-login-view')" id="login-nav-btn">تسجيل الدخول</button>
        </div>
    </nav>

    <div class="controls-section" id="hero-filters">
        <div class="filters-container">
            <!-- تم توحيد القراء لضمان دقة مزامنة الآيات -->
            <select class="filter-select" id="reciter-select" onchange="onReciterChange()">
                <option value="ar.alafasy|https://server8.mp3quran.net/afs/">مشاري العفاسي (مزامنة دقيقة)</option>
                <option value="ar.abdulbasitmurattal|https://server7.mp3quran.net/basit/">عبد الباسط عبد الصمد - مرتل</option>
                <option value="ar.minshawi|https://server10.mp3quran.net/minsh/">محمد صديق المنشاوي</option>
                <option value="ar.husary|https://server13.mp3quran.net/husr/">محمود خليل الحصري</option>
                <option value="ar.mahermuaiqly|https://server12.mp3quran.net/maher/">ماهر المعيقلي</option>
                <option value="ar.saudshuraim|https://server7.mp3quran.net/shur/">سعود الشريم</option>
                <option value="ar.muhammadayyoub|https://server8.mp3quran.net/ayyoub/">محمد أيوب</option>
                <option value="ar.hudhaify|https://server9.mp3quran.net/hthfi/">علي الحذيفي</option>
            </select>

            <select class="filter-select" id="tafsir-select">
                <option value="ar.ibnkathir">تفسير ابن كثير</option>
                <option value="ar.saadi">تفسير السعدي</option>
                <option value="ar.muyassar">التفسير الميسر</option>
                <option value="ar.qurtubi">تفسير القرطبي</option>
            </select>
        </div>
    </div>

    <div class="container">
        <!-- شبكة السور -->
        <div id="home-view">
            <div class="surah-grid" id="surah-grid-container"></div>
        </div>

        <!-- وضعية المصحف المدني (الرسم العثماني ونظام الصفحات) -->
        <div id="mushaf-view" class="mushaf-view">
            <div class="mushaf-toolbar">
                <button class="btn-nav" onclick="closeMushafView()">العودة للقائمة الرئيسية</button>
            </div>
            
            <div class="mushaf-page-container">
                <div class="surah-header-frame" id="surah-header-frame">
                    <h2 class="mushaf-title" id="mushaf-surah-title">سورة...</h2>
                </div>
                <!-- البسملة الفردية -->
                <div class="bismillah-text" id="bismillah-header" style="display: none;">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
                
                <div id="quran-display" class="quran-area">
                    جاري تحميل المصحف بالرسم العثماني الموثق...
                </div>
            </div>

            <div class="pagination-controls" id="pagination-controls" style="display: none;">
                <button class="btn-nav" id="next-page-btn" onclick="nextPage()">الصفحة التالية</button>
                <span id="page-num-indicator" style="font-weight: 800; color: var(--ios-blue); font-size: 16px;"></span>
                <button class="btn-nav" id="prev-page-btn" onclick="prevPage()">الصفحة السابقة</button>
            </div>
        </div>

        <!-- شاشات الدخول -->
        <div id="unified-login-view" class="auth-container hidden-screen">
            <h2 style="color: var(--ios-blue); margin-top: 0; font-weight: 800;">بوابة الدخول</h2>
            <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="user-email" placeholder="user@example.com" dir="ltr"></div>
            <div class="form-group"><label>كلمة المرور</label><input type="password" id="user-pass" placeholder="••••••••" dir="ltr"></div>
            <button class="auth-submit-btn" onclick="handleUnifiedLogin()">تسجيل الدخول</button>
        </div>
    </div>

    <!-- شريط التشغيل السفلي الزجاجي -->
    <div class="sticky-player">
        <div class="player-info">
            <p class="p-surah" id="player-surah-txt">اختر سورة للتشغيل</p>
            <p class="p-reciter" id="player-reciter-txt">--</p>
        </div>
        <div class="player-controls">
            <button class="action-btn-sm dl-all-btn" onclick="startDownloadFullMushafZip()">تنزيل المصحف كاملاً</button>
            <button class="play-pause-btn" id="play-btn-sticky" onclick="togglePlayState()">⏵</button>
        </div>
        <audio id="main-audio"></audio>
    </div>

    <!-- نافذة خيارات الآية -->
    <div id="action-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModals()">✖</button>
            <h3 style="color: var(--ios-text); margin-top: 0; font-weight: 800;">خيارات الآية</h3>
            <p id="selected-ayah-preview" style="font-family: 'Amiri Quran', serif; font-size: 28px; color: var(--ios-blue); margin: 20px 0; line-height: 1.8;"></p>
            <div class="ayah-actions">
                <button class="modal-action-btn action-play" onclick="playSpecificAyah()">▶ تشغيل الآية</button>
                <button class="modal-action-btn action-repeat" onclick="toggleRepeatAyah()" id="btn-repeat-ayah">🔁 تكرار الآية</button>
                <button class="modal-action-btn action-tafsir" onclick="openTafsirModal()">📖 التفسير</button>
                <button class="modal-action-btn action-copy" onclick="copyAyahText()">📋 نسخ</button>
                <button class="modal-action-btn action-share" onclick="closeModals(); showToast('جاري تصميم صورة المشاركة...');">📤 تصميم للمشاركة</button>
            </div>
        </div>
    </div>

    <!-- نافذة التفسير -->
    <div id="tafsir-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 800px;">
            <button class="close-modal" onclick="closeModals()">✖</button>
            <h3 id="tafsir-modal-title" style="color: var(--ios-green); margin-top: 0; font-weight: 800;">التفسير</h3>
            <div id="tafsir-modal-text" class="tafsir-text-box">جاري جلب التفسير...</div>
        </div>
    </div>

    <!-- نافذة تنزيل المصحف -->
    <div id="download-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="color: var(--ios-text); margin-top: 0; font-weight: 800;">جاري تحميل المصحف المرتل (ZIP)</h3>
            <p id="dl-text" style="color: var(--ios-text-secondary); font-size: 14px;">الرجاء عدم إغلاق هذه الصفحة...</p>
            <div class="dl-progress-container">
                <div id="dl-progress" class="dl-progress-bar"></div>
            </div>
            <button class="btn-nav" style="margin-top: 25px; border-color: #ef4444; color: #ef4444; background: rgba(239, 68, 68, 0.1);" onclick="cancelDownloadAll()">إلغاء التحميل</button>
        </div>
    </div>

    <div class="footer-signature">تصميم: د. محمد أبو زيد</div>

    <script>
        let globalSurahsList = []; 
        let currentSurahNumber = 1;
        let currentSurahData = null; 
        
        let currentSurahPages = [];
        let currentSurahPageIndex = 0;
        let rawAyahsTexts = []; 

        // نظام المشغل المتقدم (آية بآية)
        let audioQueue = [];
        let currentPlayingAyahIndex = -1;
        let isRepeatingVerse = false;
        let isPlaying = false;
        
        let selectedAyahIndex = 0;
        let isDownloadingAll = false;
        
        // الخوادم
        let verseByVerseReciterId = "ar.alafasy";
        let fullSurahZipServer = "https://server8.mp3quran.net/afs/";

        const audioPlayer = document.getElementById('main-audio');
        const els = {
            surahGrid: document.getElementById('surah-grid-container'),
            quranDisplay: document.getElementById('quran-display'),
            bismillahHeader: document.getElementById('bismillah-header'),
            surahHeaderFrame: document.getElementById('surah-header-frame'),
            homeView: document.getElementById('home-view'),
            mushafView: document.getElementById('mushaf-view'),
            heroFilters: document.getElementById('hero-filters'),
            playBtnSticky: document.getElementById('play-btn-sticky')
        };

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        async function initializeApp() {
            try {
                const resMeta = await fetch('https://api.alquran.cloud/v1/meta');
                const metaData = await resMeta.json();
                globalSurahsList = metaData.data.surahs.references;
                onReciterChange();
                renderSurahGrid();
            } catch (err) {
                els.surahGrid.innerHTML = '<p style="text-align:center;">خطأ في الاتصال.</p>';
            }
        }

        function onReciterChange() {
            const val = document.getElementById('reciter-select').value.split('|');
            verseByVerseReciterId = val[0];
            fullSurahZipServer = val[1];
            document.getElementById('player-reciter-txt').innerText = document.getElementById('reciter-select').options[document.getElementById('reciter-select').selectedIndex].text.split(' (')[0];
            document.getElementById('player-surah-txt').innerText = "اختر سورة للتشغيل";
            
            // إعادة ضبط المشغل
            audioPlayer.pause();
            isPlaying = false;
            els.playBtnSticky.innerHTML = "⏵";
            currentPlayingAyahIndex = -1;
            removeHighlight();
        }

        function renderSurahGrid() {
            els.surahGrid.innerHTML = '';
            globalSurahsList.forEach(s => {
                const card = document.createElement('div');
                card.className = 'surah-card';
                card.onclick = () => loadSurahForReadingAndPlaying(s.number, s.name);
                let sName = s.name.replace("سورة ", "").replace("سُورَةُ ", "");
                card.innerHTML = `
                    <div class="surah-info">
                        <div class="surah-num">${s.number}</div>
                        <h3 class="surah-name">سورة ${sName}</h3>
                    </div>
                    <div class="play-icon">⏵</div>
                `;
                els.surahGrid.appendChild(card);
            });
        }

        function padNumber(num) { return num.toString().padStart(3, '0'); }

        async function loadSurahForReadingAndPlaying(surahNum, surahName) {
            let sName = surahName.replace("سورة ", "").replace("سُورَةُ ", "");
            currentSurahNumber = surahNum;
            
            document.getElementById('player-surah-txt').innerText = `سورة ${sName}`;
            
            // إيقاف أي تلاوة سابقة
            audioPlayer.pause();
            isPlaying = false;
            els.playBtnSticky.innerHTML = "⏵";
            currentPlayingAyahIndex = -1;
            isRepeatingVerse = false;
            document.getElementById('btn-repeat-ayah').style.background = "rgba(255, 149, 0, 0.15)";
            document.getElementById('btn-repeat-ayah').style.color = "#FF9500";

            els.homeView.style.display = 'none';
            els.heroFilters.style.display = 'none';
            els.mushafView.style.display = 'block';
            document.getElementById('mushaf-surah-title').innerText = `سورة ${sName}`;
            document.getElementById('pagination-controls').style.display = 'none';
            els.quranDisplay.innerHTML = 'جاري مزامنة الآيات والصوت...';

            try {
                // جلب النص والصوت (آية بآية) في نفس الطلب لتطابق تام!
                const quranRes = await fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/${verseByVerseReciterId}`);
                currentSurahData = (await quranRes.json()).data;
                
                rawAyahsTexts = [];
                audioQueue = [];
                let pagesMap = {};
                
                // البسملة الثابتة بالرسم العثماني
                const bismillahExact = "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ";

                currentSurahData.ayahs.forEach((ayah, index) => {
                    let text = ayah.text;
                    
                    // المعالجة الدقيقة والآمنة لحذف البسملة المكررة من أول آية فقط (ما عدا الفاتحة والتوبة)
                    if (index === 0 && currentSurahNumber !== 1 && currentSurahNumber !== 9) {
                        if (text.startsWith(bismillahExact)) {
                            text = text.substring(bismillahExact.length).trim();
                        } else {
                            // تنظيف احتياطي إذا اختلفت التشكيلات
                            text = text.replace(/^بِسْمِ [^\s]+ [^\s]+ [^\s]+\s*/g, '');
                        }
                        // إزالة واو الوصل إذا ظهرت بسبب القص
                        if(text.startsWith('و ')) text = text.substring(2);
                    }
                    
                    rawAyahsTexts.push(text);
                    audioQueue.push(ayah.audio); // رابط صوت الآية المباشر
                    
                    ayah.globalIndex = index;
                    ayah.cleanText = text;

                    if(!pagesMap[ayah.page]) pagesMap[ayah.page] = [];
                    pagesMap[ayah.page].push(ayah);
                });

                currentSurahPages = Object.keys(pagesMap).map(Number).sort((a,b) => a-b).map(p => pagesMap[p]);
                currentSurahPageIndex = 0;

                renderCurrentPage();

                // تشغيل تلقائي للآية الأولى
                playAyah(0);

            } catch (err) { els.quranDisplay.innerHTML = "حدث خطأ في تحميل السورة."; console.error(err); }
        }

        function renderCurrentPage() {
            els.quranDisplay.innerHTML = '';
            const pageAyahs = currentSurahPages[currentSurahPageIndex];

            // التحكم في البسملة والترويسة (تظهر في الصفحة الأولى فقط)
            if (currentSurahPageIndex === 0) {
                els.surahHeaderFrame.style.display = 'flex';
                if (currentSurahNumber !== 1 && currentSurahNumber !== 9) {
                    els.bismillahHeader.style.display = 'block';
                } else {
                    els.bismillahHeader.style.display = 'none';
                }
            } else {
                els.surahHeaderFrame.style.display = 'none';
                els.bismillahHeader.style.display = 'none';
            }

            pageAyahs.forEach((ayah) => {
                const span = document.createElement('span');
                span.className = 'verse';
                span.id = `verse-span-${ayah.globalIndex}`;
                span.innerHTML = `${ayah.cleanText} <span class="verse-end">﴿${ayah.numberInSurah}﴾</span> `;
                span.onclick = () => { openActionModal(ayah.globalIndex); };
                els.quranDisplay.appendChild(span);
            });

            // ضبط أزرار التقليب
            const paginationDiv = document.getElementById('pagination-controls');
            paginationDiv.style.display = currentSurahPages.length > 1 ? 'flex' : 'none';
            document.getElementById('prev-page-btn').disabled = (currentSurahPageIndex === 0);
            document.getElementById('next-page-btn').disabled = (currentSurahPageIndex === currentSurahPages.length - 1);
            document.getElementById('page-num-indicator').innerText = `صفحة ${pageAyahs[0].page}`;
            
            // استعادة التظليل إذا كانت الآية الشغالة في هذه الصفحة
            applyHighlight(currentPlayingAyahIndex);
        }

        // --- محرك تشغيل الآيات (Verse-by-Verse Engine) ---
        function playAyah(index) {
            if (index < 0 || index >= audioQueue.length) {
                isPlaying = false;
                els.playBtnSticky.innerHTML = "⏵";
                removeHighlight();
                return;
            }
            
            currentPlayingAyahIndex = index;
            
            // التحقق من الصفحة لتقليبها تلقائياً!
            const ayahData = currentSurahData.ayahs[index];
            const activePageData = currentSurahPages[currentSurahPageIndex][0].page;
            
            if (ayahData.page !== activePageData) {
                // البحث عن فهرس الصفحة الجديدة
                const newPageIndex = currentSurahPages.findIndex(p => p[0].page === ayahData.page);
                if(newPageIndex !== -1) {
                    currentSurahPageIndex = newPageIndex;
                    renderCurrentPage();
                    // تمرير ناعم لأعلى الصفحة
                    document.querySelector('.mushaf-page-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }

            applyHighlight(index);

            audioPlayer.src = audioQueue[index];
            audioPlayer.play();
            isPlaying = true;
            els.playBtnSticky.innerHTML = "⏸";
        }

        audioPlayer.onended = () => {
            if (isRepeatingVerse) {
                audioPlayer.play(); // تكرار نفس الآية
            } else {
                playAyah(currentPlayingAyahIndex + 1); // الانتقال للآية التالية تلقائياً
            }
        };

        function togglePlayState() {
            if(audioQueue.length === 0) return showToast("الرجاء اختيار سورة من القائمة.");
            
            if(isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
                els.playBtnSticky.innerHTML = "⏵";
            } else {
                if(currentPlayingAyahIndex === -1) currentPlayingAyahIndex = 0;
                audioPlayer.play();
                isPlaying = true;
                els.playBtnSticky.innerHTML = "⏸";
                applyHighlight(currentPlayingAyahIndex);
            }
        }

        function applyHighlight(index) {
            removeHighlight();
            if(index !== -1) {
                const el = document.getElementById(`verse-span-${index}`);
                if(el) {
                    el.classList.add('active-verse');
                }
            }
        }
        function removeHighlight() {
            document.querySelectorAll('.verse').forEach(el => el.classList.remove('active-verse'));
        }

        // --- وظائف النافذة المنبثقة للآية ---
        function openActionModal(index) {
            selectedAyahIndex = index;
            document.getElementById('selected-ayah-preview').innerText = `﴿ ${rawAyahsTexts[index]} ﴾`;
            document.getElementById('action-modal').style.display = 'flex';
        }

        function playSpecificAyah() {
            closeModals();
            isRepeatingVerse = false;
            document.getElementById('btn-repeat-ayah').style.background = "rgba(255, 149, 0, 0.15)";
            document.getElementById('btn-repeat-ayah').style.color = "#FF9500";
            playAyah(selectedAyahIndex);
        }

        function toggleRepeatAyah() {
            isRepeatingVerse = !isRepeatingVerse;
            const btn = document.getElementById('btn-repeat-ayah');
            if(isRepeatingVerse) {
                btn.style.background = "#FF9500";
                btn.style.color = "#fff";
                playSpecificAyah(); // تشغيل فوري مع التكرار
            } else {
                btn.style.background = "rgba(255, 149, 0, 0.15)";
                btn.style.color = "#FF9500";
            }
        }

        function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none'); }

        function copyAyahText() {
            const textToCopy = `﴿ ${rawAyahsTexts[selectedAyahIndex]} ﴾\n[سورة ${currentSurahData.name.replace('سورة ','')} - آية ${currentSurahData.ayahs[selectedAyahIndex].numberInSurah}]`;
            navigator.clipboard.writeText(textToCopy).then(() => { 
                closeModals();
                showToast("تم نسخ الآية بنجاح!"); 
            });
        }

        async function openTafsirModal() {
            document.getElementById('action-modal').style.display = 'none';
            document.getElementById('tafsir-modal').style.display = 'flex';
            const tafsirBox = document.getElementById('tafsir-modal-text');
            const tafsirId = document.getElementById('tafsir-select').value;
            const tafsirName = document.getElementById('tafsir-select').options[document.getElementById('tafsir-select').selectedIndex].text;
            
            document.getElementById('tafsir-modal-title').innerText = `${tafsirName}`;
            tafsirBox.innerHTML = "جاري جلب التفسير الموثق...";

            const globalNum = currentSurahData.ayahs[selectedAyahIndex].number;
            try {
                const res = await fetch(`https://api.alquran.cloud/v1/ayah/${globalNum}/${tafsirId}`);
                const data = await res.json();
                tafsirBox.innerHTML = data.data.text;
            } catch(e) { tafsirBox.innerHTML = "حدث خطأ في جلب التفسير."; }
        }

        // تقليب الصفحات اليدوي
        function nextPage() {
            if(currentSurahPageIndex < currentSurahPages.length - 1) {
                currentSurahPageIndex++;
                renderCurrentPage();
                document.querySelector('.mushaf-page-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }
        function prevPage() {
            if(currentSurahPageIndex > 0) {
                currentSurahPageIndex--;
                renderCurrentPage();
                document.querySelector('.mushaf-page-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function closeMushafView() {
            els.mushafView.style.display = 'none';
            els.homeView.style.display = 'block';
            els.heroFilters.style.display = 'block';
            audioPlayer.pause();
        }

        // --- التنزيل الشامل بملف ZIP (يستخدم السيرفر الكامل للسرعة) ---
        async function startDownloadFullMushafZip() {
            if (!fullSurahZipServer) return showToast("الرجاء اختيار قارئ أولاً.");
            if (isDownloadingAll) return showToast("التحميل جاري بالفعل...");
            
            isDownloadingAll = true;
            document.getElementById('download-modal').style.display = 'flex';
            const progressBar = document.getElementById('dl-progress');
            const progressText = document.getElementById('dl-text');
            
            const zip = new JSZip();
            let downloadedCount = 0;
            let totalSurahs = 114;

            try {
                for (let i = 1; i <= totalSurahs; i++) {
                    if(!isDownloadingAll) throw new Error("تم الإلغاء");
                    let url = fullSurahZipServer + padNumber(i) + '.mp3';
                    let sName = globalSurahsList[i-1].name.replace('سورة ','');
                    
                    progressText.innerText = `جاري تحميل سورة ${sName} (${downloadedCount + 1} من ${totalSurahs})...`;
                    
                    const response = await fetch(url);
                    if (!response.ok) throw new Error("فشل الاتصال بالخادم");
                    const blob = await response.blob();
                    
                    zip.file(`Surah_${padNumber(i)}_${sName}.mp3`, blob);
                    
                    downloadedCount++;
                    progressBar.style.width = `${(downloadedCount / totalSurahs) * 50}%`; 
                }

                progressText.innerText = "جاري ضغط الملفات (قد يستغرق بعض الوقت)...";
                const content = await zip.generateAsync({ type: "blob" }, function updateCallback(metadata) {
                    progressBar.style.width = `${50 + (metadata.percent / 2)}%`; 
                });
                
                const reciterCleanName = document.getElementById('player-reciter-txt').innerText;
                saveAs(content, `Mushaf_${reciterCleanName}.zip`);
                showToast("تم التنزيل كاملاً بنجاح!");
            } catch(e) {
                if(e.message !== "تم الإلغاء") showToast("حدث خطأ أثناء التحميل، تأكد من اتصالك.");
            } finally {
                isDownloadingAll = false;
                document.getElementById('download-modal').style.display = 'none';
            }
        }

        function cancelDownloadAll() {
            isDownloadingAll = false;
            document.getElementById('download-modal').style.display = 'none';
            showToast("تم إيقاف التحميل بناءً على طلبك.");
        }

        function switchTab(tabId) {
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('mushaf-view').style.display = 'none';
            document.getElementById('hero-filters').style.display = 'none';
            document.getElementById('unified-login-view').classList.add('hidden-screen');
            
            if (tabId === 'home-view') {
                document.getElementById('home-view').style.display = 'block';
                document.getElementById('hero-filters').style.display = 'block';
            } else {
                document.getElementById(tabId).classList.remove('hidden-screen');
            }
            audioPlayer.pause();
        }

        function handleUnifiedLogin() {
            localStorage.setItem('userLoggedIn', 'true');
            document.getElementById('login-nav-btn').innerText = "تم الدخول";
            showToast("تم تسجيل الدخول بنجاح.");
            switchTab('home-view');
        }

        window.onload = initializeApp;
    </script>
</body>
</html>
