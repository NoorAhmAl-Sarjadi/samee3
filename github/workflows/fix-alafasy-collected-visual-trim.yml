
name: SAMEE3 - Collected Alafasy Precision Trim

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  precision-trim:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Add precision trimming to collected Alafasy only
        shell: bash
        run: |
          node <<'NODE'
          'use strict'

          const fs = require('node:fs')

          const filename = 'app/visual-ayahs/page.tsx'
          const marker = 'SAMEE3_COLLECTED_MANUAL_TRIM_V1'

          if (!fs.existsSync(filename)) {
            throw new Error('Visual Ayahs page not found')
          }

          let source = fs.readFileSync(filename, 'utf8')
            .replace(/\r\n/g, '\n')

          if (source.includes(marker)) {
            console.log('Precision trim already installed.')
            process.exit(0)
          }

          function replaceOnce(before, after, label) {
            const parts = source.split(before)

            if (parts.length !== 2) {
              throw new Error(
                label + ': expected exactly one matching location, found ' +
                (parts.length - 1) + '. No files have been written.'
              )
            }

            source = parts[0] + after + parts[1]
          }

          function insertBefore(anchor, addition, label) {
            replaceOnce(anchor, addition + anchor, label)
          }

          function insertAfter(anchor, addition, label) {
            replaceOnce(anchor, anchor + addition, label)
          }

          insertAfter(
            "const CUSTOM_KEY = 'samee3-visual-custom-templates-v2'",
            String.raw`

          // SAMEE3_COLLECTED_MANUAL_TRIM_V1
          // Offsets are seconds relative to the original collected timings.
          // They affect the selected passage only, never other readers.
          type CollectedTrimOffsets = {
            startOffset: number
            endOffset: number
          }

          const EMPTY_COLLECTED_TRIM: CollectedTrimOffsets = {
            startOffset: 0,
            endOffset: 0,
          }

          function collectedTrimKey(
            surah: number,
            from: number,
            to: number
          ) {
            return (
              'samee3_collected_visual_trim_v1:' +
              surah + ':' + from + ':' + to
            )
          }

          function roundTrimOffset(value: number) {
            if (!Number.isFinite(value)) return 0
            return Math.round(
              Math.max(-30, Math.min(30, value)) * 20
            ) / 20
          }

          function readCollectedTrim(
            surah: number,
            from: number,
            to: number
          ): CollectedTrimOffsets {
            try {
              const raw = localStorage.getItem(
                collectedTrimKey(surah, from, to)
              )

              if (!raw) return { ...EMPTY_COLLECTED_TRIM }

              const value: unknown = JSON.parse(raw)

              if (!value || typeof value !== 'object') {
                return { ...EMPTY_COLLECTED_TRIM }
              }

              const item = value as Record<string, unknown>

              if (
                typeof item.startOffset !== 'number' ||
                typeof item.endOffset !== 'number' ||
                !Number.isFinite(item.startOffset) ||
                !Number.isFinite(item.endOffset)
              ) {
                return { ...EMPTY_COLLECTED_TRIM }
              }

              return {
                startOffset: roundTrimOffset(item.startOffset),
                endOffset: roundTrimOffset(item.endOffset),
              }
            } catch {
              return { ...EMPTY_COLLECTED_TRIM }
            }
          }

          function applyCollectedTrim(
            original: CollectedClip,
            offsets: CollectedTrimOffsets
          ) {
            const originalStart = original.startSeconds
            const originalEnd =
              original.startSeconds + original.duration

            const start = Math.max(
              0,
              originalStart + offsets.startOffset
            )

            const end = originalEnd + offsets.endOffset
            const duration = end - start

            if (
              !Number.isFinite(start) ||
              !Number.isFinite(end) ||
              duration < 0.25 ||
              duration > MAX_DURATION_SECONDS
            ) {
              throw new Error(
                'حدود المقطع غير صالحة. اجعل النهاية بعد البداية، ' +
                'ولا تتجاوز مدة الفيديو 90 ثانية.'
              )
            }

            const starts = original.starts.map(
              (relative) => Math.max(
                0,
                Math.min(
                  duration,
                  originalStart + relative - start
                )
              )
            )

            return {
              startSeconds: start,
              duration,
              starts,
            }
          }
          `,
            'Trim helper functions'
          )

          insertAfter(
            `  const collectedAudioNodeRef =
            useRef<MediaElementAudioSourceNode | null>(null)`,
            String.raw`

          // Collected Alafasy editing state, isolated from other reciters.
          const collectedOriginalRef =
            useRef<CollectedClip | null>(null)

          const collectedPreviewIntervalRef =
            useRef<number | null>(null)

          const collectedPreviewTimeoutRef =
            useRef<number | null>(null)

          const collectedPreviewSequenceRef =
            useRef(0)

          const [collectedTrim, setCollectedTrim] =
            useState<CollectedTrimOffsets>(
              EMPTY_COLLECTED_TRIM
            )

          const [collectedPreviewSide, setCollectedPreviewSide] =
            useState<'start' | 'end' | null>(null)

          const [collectedTrimMessage, setCollectedTrimMessage] =
            useState('')
          `,
            'Trim state and references'
          )

          insertBefore(
            `  const stopPlayback = useCallback(`,
            String.raw`  const stopCollectedEdgePreview = useCallback(() => {
            collectedPreviewSequenceRef.current += 1

            if (collectedPreviewIntervalRef.current !== null) {
              window.clearInterval(
                collectedPreviewIntervalRef.current
              )
              collectedPreviewIntervalRef.current = null
            }

            if (collectedPreviewTimeoutRef.current !== null) {
              window.clearTimeout(
                collectedPreviewTimeoutRef.current
              )
              collectedPreviewTimeoutRef.current = null
            }

            collectedAudioRef.current?.pause()
            setCollectedPreviewSide(null)
          }, [])

          `,
            'Preview cancellation'
          )

          replaceOnce(
            `      playbackSources.current = []
                collectedAudioRef.current?.pause()

                if (reset)`,
            `      playbackSources.current = []
                collectedAudioRef.current?.pause()
                stopCollectedEdgePreview()

                if (reset)`,
            'Playback cleanup'
          )

          replaceOnce(
            `      setPlaying(false)
                setPosition(player.position)
              },
              []
            )`,
            `      setPlaying(false)
                setPosition(player.position)
              },
              [stopCollectedEdgePreview]
            )`,
            'Playback dependencies'
          )

          replaceOnce(
            `      preparedRef.current = null
                setPrepared(null)

                setError('')`,
            `      preparedRef.current = null
                collectedOriginalRef.current = null
                setPrepared(null)

                setError('')`,
            'Invalidate collected source'
          )

          insertBefore(
            `  const changeDesign = useCallback(`,
            String.raw`  function updateCollectedTrim(
            requested: CollectedTrimOffsets
          ) {
            const original = collectedOriginalRef.current
            const current = preparedRef.current

            if (!original || !current?.stream || working) return

            const offsets: CollectedTrimOffsets = {
              startOffset: roundTrimOffset(requested.startOffset),
              endOffset: roundTrimOffset(requested.endOffset),
            }

            try {
              const trim = applyCollectedTrim(original, offsets)

              stopPlayback(true)
              clearResult()

              const changed: Prepared = {
                ...current,
                starts: trim.starts,
                duration: trim.duration,
                stream: {
                  ...current.stream,
                  startSeconds: trim.startSeconds,
                },
              }

              preparedRef.current = changed
              setPrepared(changed)
              setCollectedTrim(offsets)
              setCollectedTrimMessage(
                'تم تطبيق الضبط على المعاينة والتصدير. ' +
                'اضغط حفظ الضبط للاحتفاظ به.'
              )
              setError('')
            } catch (cause) {
              setError(
                cause instanceof Error
                  ? cause.message
                  : 'تعذر ضبط حدود التلاوة.'
              )
            }
          }

          function saveCollectedTrim() {
            if (
              !preparedRef.current?.stream ||
              !collectedOriginalRef.current
            ) return

            try {
              localStorage.setItem(
                collectedTrimKey(surah, from, to),
                JSON.stringify(collectedTrim)
              )

              setCollectedTrimMessage(
                'تم حفظ ضبط البداية والنهاية لهذا المقطع ' +
                'على جهازك.'
              )
              setError('')
            } catch {
              setError(
                'تعذر حفظ الضبط على هذا الجهاز. ' +
                'يمكنك متابعة استخدامه في الجلسة الحالية.'
              )
            }
          }

          function resetCollectedTrim() {
            if (working || !preparedRef.current?.stream) {
              return
            }

            updateCollectedTrim({
              startOffset: 0,
              endOffset: 0,
            })

            try {
              localStorage.removeItem(
                collectedTrimKey(surah, from, to)
              )
            } catch {}

            setCollectedTrimMessage(
              'تمت استعادة التوقيت الأصلي لهذا المقطع.'
            )
          }

          `,
            'Collected trim controls'
          )

          replaceOnce(
            `        if (id !== requestId.current) return

                    const created: Prepared = {
                      verses: chosenVerses,
                      buffers: [],
                      starts: clip.starts,
                      duration: clip.duration,
                      stream: {
                        url: clip.url,
                        startSeconds: clip.startSeconds,
                      },
                    }`,
            String.raw`        if (id !== requestId.current) return

                    let savedOffsets = readCollectedTrim(
                      surah,
                      from,
                      to
                    )

                    let adjusted: ReturnType<typeof applyCollectedTrim>

                    try {
                      adjusted = applyCollectedTrim(clip, savedOffsets)
                    } catch {
                      savedOffsets = { ...EMPTY_COLLECTED_TRIM }
                      adjusted = applyCollectedTrim(clip, savedOffsets)
                    }

                    collectedOriginalRef.current = clip
                    setCollectedTrim(savedOffsets)
                    setCollectedTrimMessage('')

                    const created: Prepared = {
                      verses: chosenVerses,
                      buffers: [],
                      starts: adjusted.starts,
                      duration: adjusted.duration,
                      stream: {
                        url: clip.url,
                        startSeconds: adjusted.startSeconds,
                      },
                    }`,
            'Apply saved trim when preparing collected recitation'
          )

          insertBefore(
            `  async function prepareAudio() {`,
            String.raw`  async function previewCollectedEdge(
            side: 'start' | 'end'
          ) {
            const prep = preparedRef.current

            if (
              !prep?.stream ||
              !collectedOriginalRef.current ||
              working
            ) return

            stopPlayback(true)
            stopGlobalAudio()

            try {
              if (!audioContext.current) {
                audioContext.current = new AudioContext()
              }

              const context = audioContext.current
              await context.resume()

              const audio = collectedAudioElement(
                prep,
                context
              )

              const clipStart = prep.stream.startSeconds
              const clipEnd = clipStart + prep.duration

              const begin = side === 'start'
                ? clipStart
                : Math.max(clipStart, clipEnd - 3)

              const finish = side === 'start'
                ? Math.min(clipEnd, clipStart + 3)
                : clipEnd

              const sequence =
                ++collectedPreviewSequenceRef.current

              await seekCollectedAudio(audio, begin)

              if (
                sequence !== collectedPreviewSequenceRef.current
              ) return

              await audio.play()

              if (
                sequence !== collectedPreviewSequenceRef.current
              ) {
                audio.pause()
                return
              }

              setCollectedPreviewSide(side)
              setError('')

              collectedPreviewIntervalRef.current =
                window.setInterval(() => {
                  if (
                    sequence !==
                      collectedPreviewSequenceRef.current ||
                    audio.paused ||
                    audio.ended ||
                    audio.currentTime >= finish - 0.025
                  ) {
                    stopCollectedEdgePreview()
                  }
                }, 35)

              // Safety stop if streaming stalls.
              collectedPreviewTimeoutRef.current =
                window.setTimeout(
                  stopCollectedEdgePreview,
                  8000
                )
            } catch (cause) {
              stopCollectedEdgePreview()
              setError(
                cause instanceof Error
                  ? cause.message
                  : 'تعذر سماع طرف المقطع.'
              )
            }
          }

          `,
            'Listen to start/end boundary'
          )

          replaceOnce(
            `    stopGlobalAudio()

                try {
                  if (!audioContext.current) {`,
            `    stopCollectedEdgePreview()
                stopGlobalAudio()

                try {
                  if (!audioContext.current) {`,
            'Stop boundary preview before main playback'
          )

          insertAfter(
            `      collectedAudioRef.current?.pause()
                collectedAudioRef.current?.removeAttribute('src')
                collectedAudioNodeRef.current?.disconnect()`,
            String.raw`

                collectedPreviewSequenceRef.current += 1

                if (collectedPreviewIntervalRef.current !== null) {
                  window.clearInterval(
                    collectedPreviewIntervalRef.current
                  )
                }

                if (collectedPreviewTimeoutRef.current !== null) {
                  window.clearTimeout(
                    collectedPreviewTimeoutRef.current
                  )
                }`,
            'Clean up boundary timers'
          )

          insertAfter(
            `                <p className="text-sm text-[#6e8274]">
                                  {chapter?.name}
                                  {' · '}
                                  {digits(from)}–{digits(to)}
                                  {' · '}
                                  {durationText(
                                    prepared.duration
                                  )}
                                </p>`,
            String.raw`

                        {reader === 'alafasy-collected' &&
                          prepared.stream && (
                          <div className="rounded-2xl border border-[#d9c8a5] bg-[#fffcf3] p-4">
                            <h3 className="text-base font-extrabold text-[#245343]">
                              ضبط دقيق لبداية ونهاية التلاوة
                            </h3>

                            <p className="mt-2 text-xs leading-6 text-[#746d5b]">
                              للمصحف المجمع فقط. الرقم الموجب يؤخر
                              الموضع، والسالب يقدمه. استمع للطرفين
                              قبل إنشاء الفيديو، ثم احفظ الضبط.
                            </p>

                            <div className="mt-4 grid gap-4 sm:grid-cols-2">
                              <div>
                                <RangeSetting
                                  label="ضبط البداية بالثواني"
                                  min={-30}
                                  max={30}
                                  step={0.05}
                                  disabled={working}
                                  value={collectedTrim.startOffset}
                                  onChange={(value) =>
                                    updateCollectedTrim({
                                      ...collectedTrim,
                                      startOffset: value,
                                    })
                                  }
                                />

                                <label className="mt-2 block text-xs">
                                  قيمة البداية الدقيقة
                                  <input
                                    type="number"
                                    min={-30}
                                    max={30}
                                    step={0.05}
                                    disabled={working}
                                    value={collectedTrim.startOffset}
                                    onChange={(event) =>
                                      updateCollectedTrim({
                                        ...collectedTrim,
                                        startOffset: Number(
                                          event.target.value
                                        ),
                                      })
                                    }
                                    className={field}
                                  />
                                </label>
                              </div>

                              <div>
                                <RangeSetting
                                  label="ضبط النهاية بالثواني"
                                  min={-30}
                                  max={30}
                                  step={0.05}
                                  disabled={working}
                                  value={collectedTrim.endOffset}
                                  onChange={(value) =>
                                    updateCollectedTrim({
                                      ...collectedTrim,
                                      endOffset: value,
                                    })
                                  }
                                />

                                <label className="mt-2 block text-xs">
                                  قيمة النهاية الدقيقة
                                  <input
                                    type="number"
                                    min={-30}
                                    max={30}
                                    step={0.05}
                                    disabled={working}
                                    value={collectedTrim.endOffset}
                                    onChange={(event) =>
                                      updateCollectedTrim({
                                        ...collectedTrim,
                                        endOffset: Number(
                                          event.target.value
                                        ),
                                      })
                                    }
                                    className={field}
                                  />
                                </label>
                              </div>
                            </div>

                            <div className="mt-4 rounded-xl bg-white px-3 py-3 text-center text-xs leading-7 text-[#546a5b]">
                              البداية من التسجيل:
                              {' '}
                              {prepared.stream.startSeconds.toFixed(2)}
                              {' '}ثانية
                              {' · '}
                              النهاية:
                              {' '}
                              {(
                                prepared.stream.startSeconds +
                                prepared.duration
                              ).toFixed(2)}
                              {' '}ثانية
                              {' · '}
                              طول الفيديو:
                              {' '}
                              {prepared.duration.toFixed(2)}
                              {' '}ثانية
                            </div>

                            <div className="mt-4 grid grid-cols-2 gap-2">
                              <button
                                type="button"
                                className={secondary}
                                disabled={working}
                                onClick={() =>
                                  void previewCollectedEdge('start')
                                }
                              >
                                <Play size={16} />
                                اسمع أول 3 ثوانٍ
                              </button>

                              <button
                                type="button"
                                className={secondary}
                                disabled={working}
                                onClick={() =>
                                  void previewCollectedEdge('end')
                                }
                              >
                                <Play size={16} />
                                اسمع آخر 3 ثوانٍ
                              </button>
                            </div>

                            {collectedPreviewSide && (
                              <button
                                type="button"
                                className={secondary + ' mt-2 w-full'}
                                onClick={stopCollectedEdgePreview}
                              >
                                <Pause size={16} />
                                إيقاف اختبار الطرف
                              </button>
                            )}

                            <div className="mt-3 grid grid-cols-2 gap-2">
                              <button
                                type="button"
                                disabled={working}
                                className={primary}
                                onClick={saveCollectedTrim}
                              >
                                <Save size={16} />
                                حفظ الضبط
                              </button>

                              <button
                                type="button"
                                disabled={working}
                                className={secondary}
                                onClick={resetCollectedTrim}
                              >
                                <RefreshCcw size={16} />
                                التوقيت الأصلي
                              </button>
                            </div>

                            {collectedTrimMessage && (
                              <p
                                role="status"
                                className="mt-3 text-xs leading-6 text-[#245343]"
                              >
                                {collectedTrimMessage}
                              </p>
                            )}
                          </div>
                        )}`,
            'Precision editor UI'
          )

          if (!source.includes(marker)) {
            throw new Error('Trim marker missing after patch')
          }

          // Write only after ALL exact-code checks succeed.
          fs.writeFileSync(filename, source, 'utf8')

          console.log('Collected Alafasy trim controls added.')
          console.log('Other reciters and template data unchanged.')
          NODE

      - name: Verify precision tools exist
        run: |
          grep -Fq 'SAMEE3_COLLECTED_MANUAL_TRIM_V1' app/visual-ayahs/page.tsx
          grep -Fq 'previewCollectedEdge' app/visual-ayahs/page.tsx
          grep -Fq 'saveCollectedTrim' app/visual-ayahs/page.tsx
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Build and type-check SAMEE3
        run: npm run build

      - name: Commit only successfully built page
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/visual-ayahs/page.tsx

          if git diff --cached --quiet; then
            echo "Precision trim is already installed."
            exit 0
          fi

          git commit -m "feat: precision start and end trim for collected Alafasy only"
          git push origin HEAD:main
