
name: SAMEE3 - Alafasy Riwayat Auto Update

on:
  schedule:
    - cron: '23 4,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: samee3-alafasy-riwayat-auto
  cancel-in-progress: false

jobs:
  discover-verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scanner dependencies
        run: |
          python -m pip install \
            'requests>=2.32,<3' \
            'beautifulsoup4>=4.12,<5'

      - name: Integrate audio library
        run: |
          python scripts/install-alafasy-five.py

      - name: Discover and validate mushafs
        run: |
          python scripts/sync-alafasy-riwayat.py

      - name: Check changes
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- app/audio/page.tsx lib/alafasy-riwayat-manifest.json)" ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm ci

      - name: Validate build
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Commit verified changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            app/audio/page.tsx \
            lib/alafasy-riwayat-manifest.json

          git commit -m "feat(audio): sync verified Alafasy riwayat mushafs"

          git push
