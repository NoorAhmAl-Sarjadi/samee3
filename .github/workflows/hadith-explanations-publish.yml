name: SAMEE3 Hadith Explanations Publish

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PUBLISH_REVIEWED after human review and permissions verification'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: samee3-hadith-explanations-drafts
  cancel-in-progress: false

jobs:
  publish-approved-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate and publish human-approved explanations
        shell: bash
        env:
          SAMEE3_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, mkdir, writeFile } from 'node:fs/promises'
          import { createHash } from 'node:crypto'
          import { resolve } from 'node:path'

          const QUEUE_FILE = resolve('data/hadith-explanations-review-queue.json')
          const PUBLIC_FILE = resolve('public/data/hadith-explanations.json')
          const MAX_QUEUE_BYTES = 2 * 1024 * 1024
          const MAX_PUBLIC_BYTES = 3 * 1024 * 1024
          const MAX_SOURCE_BYTES = 250000
          const MAX_ENTRIES = 8000
          const CONFIRMATION = 'PUBLISH_REVIEWED'
          const BOOKS = new Set([
            'bukhari', 'muslim', 'abudawud', 'nasai', 'tirmidhi',
            'ibnmajah', 'malik', 'darimi', 'ahmed', 'nawawi40',
            'qudsi40', 'shahwaliullah40', 'riyad_assalihin',
            'mishkat_almasabih', 'bulugh_almaram',
            'aladab_almufrad', 'shamail_muhammadiyah',
          ])

          const object = x => x !== null && typeof x === 'object' && !Array.isArray(x)
          const hasText = (x, limit) => typeof x === 'string' && !!x.trim() && x.length <= limit
          const integer = (x, min = 1) => Number.isSafeInteger(x) && x >= min && x <= 1000000
          const fail = message => { throw new Error(message) }
          const ensure = (condition, message) => { if (!condition) fail(message) }
          const normalized = input => input.normalize('NFKC')
            .replace(/[\u064B-\u065F\u0670\u0640]/g, '')
            .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي')
            .replace(/ؤ/g, 'و').replace(/ئ/g, 'ي').replace(/ة/g, 'ه')
            .replace(/[^\u0621-\u064Aa-zA-Z0-9]+/g, ' ')
            .replace(/\s+/g, ' ').trim()

          function publicHttps(value, description) {
            ensure(hasText(value, 2048), `${description}: URL is missing`)
            let url
            try { url = new URL(value) }
            catch { fail(`${description}: malformed URL`) }
            ensure(
              url.protocol === 'https:' && !url.username && !url.password && !url.port &&
              url.hostname.includes('.') && url.hostname !== 'localhost' &&
              !url.hostname.endsWith('.local'),
              `${description}: expected public HTTPS URL`,
            )
            return url.href
          }

          function validDate(value, description) {
            ensure(hasText(value, 10) && /^\d{4}-\d{2}-\d{2}$/.test(value), `${description}: invalid date`)
            const date = new Date(`${value}T00:00:00Z`)
            ensure(!Number.isNaN(date.getTime()) && date.toISOString().slice(0, 10) === value,
              `${description}: impossible date`)
            ensure(value <= new Date().toISOString().slice(0, 10), `${description}: future date`)
          }

          function validateEntry(entry, location) {
            ensure(object(entry), `${location}: not an object`)
            ensure(hasText(entry.id, 100) && /^[a-zA-Z0-9_-]{4,100}$/.test(entry.id), `${location}: invalid ID`)
            ensure(BOOKS.has(entry.bookId), `${location}: unknown book`)
            ensure(integer(entry.chapterId, 0) && integer(entry.hadithNumber), `${location}: invalid chapter/hadith number`)
            ensure(hasText(entry.title, 180) && hasText(entry.explanation, 35000), `${location}: missing title or explanation`)
            ensure(hasText(entry.textAnchor, 280) && normalized(entry.textAnchor).length >= 18,
              `${location}: invalid matching text`)
            ensure(Array.isArray(entry.vocabulary) && entry.vocabulary.length <= 80,
              `${location}: invalid vocabulary`)
            ensure(Array.isArray(entry.benefits) && entry.benefits.length <= 50,
              `${location}: invalid benefits`)
            for (const item of entry.vocabulary) {
              ensure(object(item) && hasText(item.word, 150) && hasText(item.meaning, 1200),
                `${location}: invalid vocabulary entry`)
            }
            for (const item of entry.benefits) ensure(hasText(item, 2500), `${location}: invalid benefit`)
            ensure(object(entry.source), `${location}: explanation source missing`)
            ensure(hasText(entry.source.title, 250) && hasText(entry.source.reference, 500),
              `${location}: explanation source title/reference required`)
            if (entry.source.author !== undefined) {
              ensure(hasText(entry.source.author, 250), `${location}: invalid source author`)
            }
            publicHttps(entry.source.url, location)
            ensure(object(entry.editorial) && entry.editorial.status === 'approved',
              `${location}: scholarly/editorial review not approved`)
            ensure(hasText(entry.editorial.reviewedBy, 180), `${location}: named reviewer required`)
            validDate(entry.editorial.reviewedAt, location)
            ensure(['licensed', 'public-domain', 'original'].includes(entry.editorial.rights),
              `${location}: rights must be verified by human reviewer`)
          }

          function key(entry) { return `${entry.bookId}:${entry.chapterId}:${entry.hadithNumber}` }

          async function readJson(path, maxBytes) {
            let bytes
            try { bytes = await readFile(path) }
            catch (error) {
              if (error?.code === 'ENOENT') fail(`File missing: ${path}`)
              throw error
            }
            ensure(bytes.byteLength <= maxBytes, `File too large: ${path}`)
            return JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(bytes))
          }

          async function checkOriginalHadith(draft) {
            const expectedUrl = `https://alfurqan.online/api/v1/hadith/${draft.bookId}/hadith/${draft.hadithNumber}`
            ensure(object(draft.hadithSource), `${draft.id}: original hadith source missing`)
            ensure(draft.hadithSource.url === expectedUrl, `${draft.id}: original source URL changed`)
            ensure(typeof draft.hadithSource.textSha256 === 'string' &&
              /^[a-f0-9]{64}$/.test(draft.hadithSource.textSha256),
              `${draft.id}: original text checksum missing`)

            const controller = new AbortController()
            const timer = setTimeout(() => controller.abort(), 16000)
            try {
              const response = await fetch(expectedUrl, {
                redirect: 'error',
                headers: { Accept: 'application/json' },
                signal: controller.signal,
              })
              ensure(response.ok && !!response.body, `${draft.id}: cannot verify original hadith (HTTP ${response.status})`)
              const reader = response.body.getReader()
              const chunks = []
              let bytes = 0
              try {
                for (;;) {
                  const { done, value } = await reader.read()
                  if (done) break
                  if (!value) continue
                  bytes += value.byteLength
                  if (bytes > MAX_SOURCE_BYTES) fail(`${draft.id}: original response too large`)
                  chunks.push(value)
                }
              } finally { reader.releaseLock() }
              const merged = new Uint8Array(bytes)
              let position = 0
              for (const part of chunks) { merged.set(part, position); position += part.byteLength }
              const responseData = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(merged))
              const hadith = responseData?.hadith
              ensure(object(responseData?.book) && responseData.book.id === draft.bookId,
                `${draft.id}: original book mismatch`)
              ensure(object(hadith) && hadith.idInBook === draft.hadithNumber &&
                hadith.chapterId === draft.chapterId && hasText(hadith.arabic, 150000),
                `${draft.id}: original hadith numbering/text mismatch`)
              const checksum = createHash('sha256').update(hadith.arabic, 'utf8').digest('hex')
              ensure(checksum === draft.hadithSource.textSha256,
                `${draft.id}: original hadith text changed; human re-review required`)
              ensure(normalized(hadith.arabic).includes(normalized(draft.textAnchor)),
                `${draft.id}: quoted text is not found in the source hadith`)
            } finally { clearTimeout(timer) }
          }

          ensure(process.env.SAMEE3_CONFIRMATION === CONFIRMATION,
            `Enter ${CONFIRMATION} in the manual workflow confirmation field`)
          const actor = (process.env.GITHUB_ACTOR || '').toLowerCase()
          const owner = (process.env.GITHUB_REPOSITORY || '').split('/')[0].toLowerCase()
          ensure(!!actor && !!owner && actor === owner,
            'Only the repository owner can run the publication workflow')

          const queue = await readJson(QUEUE_FILE, MAX_QUEUE_BYTES)
          ensure(object(queue) && queue.version === 1 && queue.purpose === 'human-review-only' &&
            Array.isArray(queue.drafts), 'Unexpected review queue format')
          ensure(queue.drafts.length <= MAX_ENTRIES, 'Too many review drafts')

          const document = await readJson(PUBLIC_FILE, MAX_PUBLIC_BYTES)
          ensure(object(document) && document.version === 1 && Array.isArray(document.entries),
            'Expected public JSON format { version: 1, entries: [] }')
          ensure(document.entries.length <= MAX_ENTRIES, 'Public catalog too large')

          const ids = new Set()
          const existingById = new Map()
          const existingByKey = new Map()
          for (const entry of document.entries) {
            validateEntry(entry, 'Existing published record')
            ensure(!existingById.has(entry.id) && !existingByKey.has(key(entry)),
              `Existing published dataset has duplicates: ${entry.id}`)
            existingById.set(entry.id, entry)
            existingByKey.set(key(entry), entry)
          }

          let accepted = 0
          let pending = 0
          let unchanged = 0
          const newEntries = []
          for (const draft of queue.drafts) {
            ensure(object(draft) && hasText(draft.id, 100) && !ids.has(draft.id),
              'Invalid or repeated draft ID')
            ids.add(draft.id)
            const status = draft.editorial?.status
            if (status === 'pending-human-review' || status === 'rejected') {
              pending += 1
              continue
            }
            ensure(status === 'approved', `${draft.id}: unsupported editorial status`)
            ensure(draft.id === `${draft.bookId}-${draft.hadithNumber}` ||
              /^[a-zA-Z0-9_-]{4,100}$/.test(draft.id),
              `${draft.id}: invalid draft ID`)
            ensure(object(draft.explanationSource), `${draft.id}: scholarly source missing`)
            const entry = {
              id: draft.id,
              bookId: draft.bookId,
              chapterId: draft.chapterId,
              hadithNumber: draft.hadithNumber,
              textAnchor: draft.textAnchor,
              title: draft.title,
              explanation: draft.explanation,
              vocabulary: draft.vocabulary,
              benefits: draft.benefits,
              source: {
                title: draft.explanationSource.title,
                ...(draft.explanationSource.author !== undefined
                  ? { author: draft.explanationSource.author } : {}),
                reference: draft.explanationSource.reference,
                url: draft.explanationSource.url,
              },
              editorial: {
                status: 'approved',
                reviewedBy: draft.editorial.reviewedBy,
                reviewedAt: draft.editorial.reviewedAt,
                rights: draft.editorial.rights,
              },
            }
            validateEntry(entry, `Review draft ${draft.id}`)
            const oldById = existingById.get(entry.id)
            const oldByKey = existingByKey.get(key(entry))
            if (oldById || oldByKey) {
              ensure(!!oldById && !!oldByKey && oldById === oldByKey,
                `${entry.id}: conflicts with a different published hadith`)
              ensure(JSON.stringify(oldById) === JSON.stringify(entry),
                `${entry.id}: published explanation differs; manual replacement required`)
              unchanged += 1
              continue
            }
            await checkOriginalHadith(draft)
            newEntries.push(entry)
            existingById.set(entry.id, entry)
            existingByKey.set(key(entry), entry)
            accepted += 1
          }

          console.log(`Review queue: ${queue.drafts.length} drafts, ${pending} awaiting review, ${unchanged} already published, ${accepted} newly approved`)
          if (!newEntries.length) {
            console.log('Nothing to publish. No existing explanation was changed.')
            process.exit(0)
          }

          const updated = { version: 1, entries: [...document.entries, ...newEntries] }
          ensure(updated.entries.length <= MAX_ENTRIES, 'Published explanations exceed catalog limit')
          const output = `${JSON.stringify(updated, null, 2)}\n`
          ensure(Buffer.byteLength(output, 'utf8') <= MAX_PUBLIC_BYTES, 'Published explanations exceed file size limit')
          await mkdir(resolve('public/data'), { recursive: true })
          await writeFile(PUBLIC_FILE, output, 'utf8')
          console.log(`Published ${accepted} verified, human-approved entries; no pending drafts were published`)
          NODE

      - name: Commit verified publication
        shell: bash
        run: |
          git add public/data/hadith-explanations.json
          if git diff --cached --quiet; then
            echo 'No new approved explanations. Nothing committed.'
            exit 0
          fi
          git config user.name 'SAMEE3 Hadith Editorial Release'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'content(hadith): publish human-reviewed explanations'
          git push origin HEAD:main
