
name: SAMEE3 - Add Collected Alafasy to Index and Visual Ayahs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout SAMEE3 repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Integrate collected Alafasy
        run: node scripts/integrate-alafasy-index-visual.cjs

      - name: Verify index integration V2
        shell: bash
        run: |
          set -e
          grep -Fq 'SAMEE3_ALAFASY_COLLECTED_INDEX_VISUAL_V2' app/surahs/page.tsx
          echo "Index integration verified."

      - name: Verify visual reciter
        shell: bash
        run: |
          set -e
          grep -Fq 'alafasy-collected' lib/samee3-visual-config.ts
          grep -Fq 'loadCollectedVisualClip' app/visual-ayahs/page.tsx
          echo "Visual Ayahs integration verified."

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit verified changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/surahs/page.tsx \
            app/visual-ayahs/page.tsx \
            lib/samee3-visual-config.ts

          if git diff --cached --quiet; then
            echo "Integration already committed."
            exit 0
          fi

          git commit -m "feat: integrate collected Alafasy in index and visual ayahs"

          git push origin HEAD:main

          echo "Collected Alafasy integration successfully committed."
