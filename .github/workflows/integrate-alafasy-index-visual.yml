
name: SAMEE3 - Add Collected Alafasy to Index and Visual Ayahs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Patch existing pages without replacing their features
        run: node scripts/integrate-alafasy-index-visual.cjs
      - name: Verify the collected reader is present in both sections
        shell: bash
        run: |
          grep -q 'SAMEE3_ALAFASY_COLLECTED_INDEX_VISUAL_V1' app/surahs/page.tsx
          grep -q "alafasy-collected" lib/samee3-visual-config.ts
          grep -q 'loadCollectedVisualClip' app/visual-ayahs/page.tsx
      - name: Install project dependencies
        run: npm ci
      - name: Check production build before saving modifications
        run: npm run build
      - name: Commit only if the full production build succeeded
        shell: bash
        run: |
          if git diff --quiet -- app/surahs/page.tsx lib/samee3-visual-config.ts app/visual-ayahs/page.tsx; then
            echo 'Already applied. Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/surahs/page.tsx lib/samee3-visual-config.ts app/visual-ayahs/page.tsx
          git commit -m 'feat: collected Alafasy in surah index and visual ayahs'
          git push
