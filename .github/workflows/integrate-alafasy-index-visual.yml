
name: SAMEE3 - Add Collected Alafasy to Index and Visual Ayahs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout SAMEE3
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Integrate Collected Alafasy V2
        run: node scripts/integrate-alafasy-index-visual.cjs

      - name: Verify Index Integration
        run: |
          grep -Fq 'SAMEE3_ALAFASY_COLLECTED_INDEX_VISUAL_V2' app/surahs/page.tsx

      - name: Verify Visual Ayahs Integration
        run: |
          grep -Fq 'alafasy-collected' lib/samee3-visual-config.ts
          grep -Fq 'loadCollectedVisualClip' app/visual-ayahs/page.tsx

      - name: Fix TypeScript Optional Stream Error
        shell: bash
        run: |
          node <<'NODE'
          'use strict'

          const fs = require('node:fs')

          const file = 'app/visual-ayahs/page.tsx'
          const source = fs.readFileSync(file, 'utf8')

          const oldCode = 'clip.stream.startSeconds'
          const newCode = 'clip.stream!.startSeconds'

          if (source.includes(newCode) && !source.includes(oldCode)) {
            console.log('TypeScript fix already applied.')
            process.exit(0)
          }

          const occurrences = source.split(oldCode).length - 1

          if (occurrences !== 1) {
            throw new Error(
              'Expected exactly one collected stream reference. Found: ' +
              occurrences
            )
          }

          const updated = source.replace(oldCode, newCode)

          fs.writeFileSync(file, updated, 'utf8')

          console.log('Fixed TS18048 in visual ayahs.')
          NODE

      - name: Install Dependencies
        run: npm ci

      - name: Check Production Build
        run: npm run build

      - name: Commit Verified Changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/surahs/page.tsx \
            app/visual-ayahs/page.tsx \
            lib/samee3-visual-config.ts

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "fix: collected Alafasy visual streaming and index integration"

          git push origin HEAD:main

          echo "Changes committed successfully."
