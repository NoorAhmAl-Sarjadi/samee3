
name: SAMEE3 - Alafasy Precision Trim V4

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: samee3-alafasy-precision-trim
  cancel-in-progress: false

jobs:
  install:
    name: Install, Repair, Build and Commit
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout SAMEE3 main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify precision editor
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/visual-ayahs/Samee3CollectedTrimEditor.tsx"

          if [ ! -f "$FILE" ]; then
            echo "::error::Precision editor file is missing."
            echo "Expected: $FILE"
            exit 1
          fi

          grep -Fq \
            'export function Samee3CollectedTrimEditor' \
            "$FILE"

          grep -Fq \
            'export function applyStoredCollectedTrim' \
            "$FILE"

          grep -Fq \
            'SAMEE3_COLLECTED_MANUAL_TRIM_V3' \
            "$FILE"

          echo "Precision editor verified."

      - name: Integrate Alafasy trim safely
        shell: bash
        run: |
          node <<'NODE'
          'use strict'

          const fs = require('node:fs')
          const ts = require('typescript')

          const filename = 'app/visual-ayahs/page.tsx'
          const marker = 'SAMEE3_COLLECTED_MANUAL_TRIM_V4'

          if (!fs.existsSync(filename)) {
            throw new Error(
              'Visual Ayahs page.tsx was not found.'
            )
          }

          let source = fs
            .readFileSync(filename, 'utf8')
            .replace(/\r\n/g, '\n')

          if (
            source.includes(marker) ||
            source.includes(
              'SAMEE3_COLLECTED_MANUAL_TRIM_V3'
            )
          ) {
            console.log(
              'Precision trim integration already exists.'
            )
            process.exit(0)
          }

          // Repair syntax left by earlier failed patches,
          // without changing audio or timing calculations.
          source = source.replace(
            /(useRef<HTMLAudioElement\s*\|\s*null>\(null\))[ \t]+(const collectedAudioNodeRef\s*=)/g,
            '$1\n\n  $2'
          )

          source = source.replace(
            /(\},\s*\[\s*\]\s*\))[ \t]+(const stopCollectedEdge\s*=)/g,
            '$1\n\n  $2'
          )

          const file = ts.createSourceFile(
            filename,
            source,
            ts.ScriptTarget.Latest,
            true,
            ts.ScriptKind.TSX
          )

          function checkSyntax(parsed, label) {
            if (!parsed.parseDiagnostics.length) return

            const messages = parsed.parseDiagnostics
              .slice(0, 5)
              .map(item =>
                ts.flattenDiagnosticMessageText(
                  item.messageText,
                  '\n'
                )
              )

            throw new Error(
              label + ':\n' + messages.join('\n')
            )
          }

          checkSyntax(file, 'Existing TSX syntax error')

          const edits = []

          function insert(position, text) {
            edits.push({
              start: position,
              end: position,
              text,
            })
          }

          function replace(start, end, text) {
            edits.push({ start, end, text })
          }

          // Locate the Prepared type through TypeScript AST.
          let preparedType = null

          for (const statement of file.statements) {
            if (
              ts.isTypeAliasDeclaration(statement) &&
              statement.name.text === 'Prepared' &&
              ts.isTypeLiteralNode(statement.type)
            ) {
              preparedType = statement.type
              break
            }
          }

          if (!preparedType) {
            throw new Error(
              'Unable to find the Prepared type.'
            )
          }

          const alreadyHasOriginal =
            preparedType.members.some(
              member =>
                member.name?.getText(file) ===
                'collectedOriginal'
            )

          if (!alreadyHasOriginal) {
            insert(
              preparedType.getEnd() - 1,
              `
                collectedOriginal?: {
                  startSeconds: number
                  duration: number
                  starts: number[]
                }
              `
            )
          }

          function isNamedVariable(statement, name) {
            return (
              ts.isVariableStatement(statement) &&
              statement.declarationList.declarations.some(
                declaration =>
                  declaration.name.getText(file) === name
              )
            )
          }

          // Find the collected Alafasy preparation block.
          let preparedStatement = null

          function findCollectedPreparation(node) {
            if (ts.isBlock(node)) {
              const statements = [...node.statements]

              const clipIndex = statements.findIndex(
                statement =>
                  isNamedVariable(statement, 'clip') &&
                  statement.getText(file).includes(
                    'loadCollectedVisualClip'
                  )
              )

              if (clipIndex >= 0) {
                const created = statements
                  .slice(clipIndex + 1)
                  .find(statement =>
                    isNamedVariable(statement, 'created')
                  )

                if (created) {
                  if (preparedStatement) {
                    throw new Error(
                      'Multiple collected preparation blocks found.'
                    )
                  }

                  preparedStatement = created
                }
              }
            }

            ts.forEachChild(
              node,
              findCollectedPreparation
            )
          }

          findCollectedPreparation(file)

          if (!preparedStatement) {
            throw new Error(
              'Collected Alafasy preparation block not found. ' +
              'No changes have been saved.'
            )
          }

          const declaration =
            preparedStatement.declarationList.declarations
              .find(item =>
                item.name.getText(file) === 'created'
              )

          const object = declaration?.initializer

          if (
            !object ||
            !ts.isObjectLiteralExpression(object)
          ) {
            throw new Error(
              'Unable to inspect the collected Prepared object.'
            )
          }

          function findProperty(objectNode, name) {
            return objectNode.properties.find(
              property =>
                ts.isPropertyAssignment(property) &&
                property.name.getText(file) === name
            )
          }

          const starts = findProperty(
            object,
            'starts'
          )

          const duration = findProperty(
            object,
            'duration'
          )

          const stream = findProperty(
            object,
            'stream'
          )

          if (
            !starts ||
            !duration ||
            !stream ||
            !ts.isObjectLiteralExpression(
              stream.initializer
            )
          ) {
            throw new Error(
              'Collected audio timing fields are incomplete.'
            )
          }

          const startSeconds = findProperty(
            stream.initializer,
            'startSeconds'
          )

          if (!startSeconds) {
            throw new Error(
              'Collected startSeconds field is missing.'
            )
          }

          const expectedValues = [
            [starts, 'clip.starts'],
            [duration, 'clip.duration'],
            [startSeconds, 'clip.startSeconds'],
          ]

          for (const [property, expected] of expectedValues) {
            const actual = property.initializer.getText(
              file
            )

            if (actual !== expected) {
              throw new Error(
                'Unexpected original timing expression: ' +
                actual
              )
            }
          }

          const statementStart =
            preparedStatement.getStart(file)

          const startOfLine =
            source.lastIndexOf(
              '\n',
              statementStart - 1
            ) + 1

          const indent = source.slice(
            startOfLine,
            statementStart
          )

          // Adjust collected Alafasy timings only.
          insert(
            statementStart,
            'const samee3AdjustedClip = ' +
            'applyStoredCollectedTrim(' +
            'clip, surah, from, to)\n' +
            indent
          )

          replace(
            starts.initializer.getStart(file),
            starts.initializer.getEnd(),
            'samee3AdjustedClip.starts'
          )

          replace(
            duration.initializer.getStart(file),
            duration.initializer.getEnd(),
            'samee3AdjustedClip.duration'
          )

          replace(
            startSeconds.initializer.getStart(file),
            startSeconds.initializer.getEnd(),
            'samee3AdjustedClip.startSeconds'
          )

          if (
            !findProperty(object, 'collectedOriginal')
          ) {
            const last = object.properties[
              object.properties.length - 1
            ]

            if (!last) {
              throw new Error(
                'Prepared object has no fields.'
              )
            }

            const tail = source.slice(
              last.getEnd(),
              object.getEnd() - 1
            )

            const comma = tail.includes(',') ? '' : ','

            insert(
              object.getEnd() - 1,
              comma +
              `
                collectedOriginal: {
                  startSeconds: clip.startSeconds,
                  duration: clip.duration,
                  starts: clip.starts,
                },
              `
            )
          }

          // Locate an existing prepared-audio JSX region.
          const uiLocations = []

          function findPreparedUI(node) {
            if (
              ts.isJsxExpression(node) &&
              node.expression &&
              ts.isBinaryExpression(node.expression) &&
              node.expression.operatorToken.kind ===
                ts.SyntaxKind.AmpersandAmpersandToken &&
              node.expression.left.getText(file) ===
                'prepared'
            ) {
              uiLocations.push(
                node.getStart(file)
              )
            }

            ts.forEachChild(node, findPreparedUI)
          }

          findPreparedUI(file)

          if (!uiLocations.length) {
            throw new Error(
              'Prepared audio interface was not found.'
            )
          }

          const editorUI = `
            {reader === 'alafasy-collected' &&
              prepared?.stream &&
              prepared.collectedOriginal && (
                <Samee3CollectedTrimEditor
                  key={reader + ':' + surah + ':' + from + ':' + to}
                  surah={surah}
                  from={from}
                  to={to}
                  streamUrl={prepared.stream.url}
                  original={prepared.collectedOriginal}
                  disabled={working}
                  onStop={() => stopPlayback(true)}
                  onApply={timing => {
                    const current = preparedRef.current

                    if (!current?.stream || working) return

                    stopPlayback(true)
                    clearResult()

                    const updated: Prepared = {
                      ...current,
                      starts: timing.starts,
                      duration: timing.duration,
                      stream: {
                        ...current.stream,
                        startSeconds: timing.startSeconds,
                      },
                    }

                    preparedRef.current = updated
                    setPrepared(updated)
                  }}
                />
              )}

          `

          insert(
            uiLocations[0],
            editorUI
          )

          // Add imports after the client directive.
          const firstNewline = source.indexOf('\n')

          if (
            firstNewline < 0 ||
            !source
              .slice(0, firstNewline)
              .includes("'use client'")
          ) {
            throw new Error(
              'Visual Ayahs client directive is missing.'
            )
          }

          insert(
            firstNewline + 1,
            `// ${marker}\n` +
            `import {\n` +
            `  Samee3CollectedTrimEditor,\n` +
            `  applyStoredCollectedTrim,\n` +
            `} from './Samee3CollectedTrimEditor'\n`
          )

          // Apply edits from the end to avoid shifting offsets.
          edits.sort(
            (a, b) =>
              b.start - a.start ||
              b.end - a.end
          )

          for (const edit of edits) {
            source =
              source.slice(0, edit.start) +
              edit.text +
              source.slice(edit.end)
          }

          const result = ts.createSourceFile(
            filename,
            source,
            ts.ScriptTarget.Latest,
            true,
            ts.ScriptKind.TSX
          )

          checkSyntax(
            result,
            'Generated TSX syntax error'
          )

          const required = [
            marker,
            'samee3AdjustedClip.starts',
            'samee3AdjustedClip.duration',
            'samee3AdjustedClip.startSeconds',
            'collectedOriginal:',
            '<Samee3CollectedTrimEditor',
          ]

          for (const token of required) {
            if (!source.includes(token)) {
              throw new Error(
                'Incomplete integration: ' + token
              )
            }
          }

          // Only write after all checks have passed.
          fs.writeFileSync(
            filename,
            source,
            'utf8'
          )

          console.log(
            'Alafasy Precision Trim V4 integrated.'
          )

          console.log(
            'Other reciters and templates were not modified.'
          )
          NODE

      - name: Remove generated trailing whitespace
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path("app/visual-ayahs/page.tsx"),
              Path(
                  "app/visual-ayahs/"
                  "Samee3CollectedTrimEditor.tsx"
              ),
          ]

          for path in paths:
              if not path.is_file():
                  raise SystemExit(
                      f"ERROR: Missing file: {path}"
                  )

              original = path.read_text(
                  encoding="utf-8"
              )

              # Remove whitespace at line endings,
              # including whitespace-only blank lines.
              repaired = re.sub(
                  r"(?m)[ \t]+$",
                  "",
                  original
              )

              if repaired != original:
                  path.write_text(
                      repaired,
                      encoding="utf-8"
                  )

                  print(
                      f"Whitespace cleaned: {path}"
                  )
              else:
                  print(
                      f"No whitespace problems: {path}"
                  )
          PY

      - name: Validate all changed files
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          grep -Eq \
            'SAMEE3_COLLECTED_MANUAL_TRIM_V(3|4)' \
            app/visual-ayahs/page.tsx

          grep -Fq \
            'SAMEE3_COLLECTED_MANUAL_TRIM_V3' \
            app/visual-ayahs/Samee3CollectedTrimEditor.tsx

          grep -Fq \
            'applyStoredCollectedTrim' \
            app/visual-ayahs/page.tsx

          grep -Fq \
            'Samee3CollectedTrimEditor' \
            app/visual-ayahs/page.tsx

          echo "Validation successful."
          echo "Changed files:"
          git status --short

      - name: Build SAMEE3
        run: npm run build

      - name: Commit verified files
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/visual-ayahs/page.tsx \
            app/visual-ayahs/Samee3CollectedTrimEditor.tsx

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m \
            "feat: install verified Alafasy precision trim V4"

          git push origin HEAD:main

      - name: Final summary
        shell: bash
        run: |
          {
            echo "## SAMEE3 - Precision Trim V4"
            echo ""
            echo "- Existing precision editor verified"
            echo "- Visual Ayahs integration checked"
            echo "- Trailing whitespace cleaned"
            echo "- Production build passed"
            echo "- Verified changes committed"
          } >> "$GITHUB_STEP_SUMMARY"
