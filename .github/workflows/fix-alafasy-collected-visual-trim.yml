
name: SAMEE3 - Alafasy Precision Trim V3

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: samee3-alafasy-trim-v3
  cancel-in-progress: false

jobs:
  install:
    name: Install, Test and Commit
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create independent precision editor
        shell: bash
        run: |
          cat > app/visual-ayahs/Samee3CollectedTrimEditor.tsx <<'TSX'
          'use client'

          // SAMEE3_COLLECTED_MANUAL_TRIM_V3
          // Only for the collected Alafasy recording.

          import {
            useCallback,
            useEffect,
            useRef,
            useState,
          } from 'react'

          import {
            MAX_DURATION_SECONDS,
          } from '@/lib/samee3-visual-config'

          export type CollectedTiming = {
            startSeconds: number
            duration: number
            starts: number[]
          }

          type Offsets = {
            startOffset: number
            endOffset: number
          }

          type EditorProps = {
            surah: number
            from: number
            to: number
            streamUrl: string
            original: CollectedTiming
            disabled: boolean
            onStop: () => void
            onApply: (timing: CollectedTiming) => void
          }

          const EMPTY: Offsets = {
            startOffset: 0,
            endOffset: 0,
          }

          function storageKey(
            surah: number,
            from: number,
            to: number
          ) {
            return (
              'samee3_collected_visual_trim_v3:' +
              surah + ':' + from + ':' + to
            )
          }

          function normalize(value: number) {
            if (!Number.isFinite(value)) return 0

            return (
              Math.round(
                Math.max(-30, Math.min(30, value)) * 20
              ) / 20
            )
          }

          function readSaved(
            surah: number,
            from: number,
            to: number
          ): Offsets {
            try {
              const raw = localStorage.getItem(
                storageKey(surah, from, to)
              )

              if (!raw) return { ...EMPTY }

              const parsed: unknown = JSON.parse(raw)

              if (
                !parsed ||
                typeof parsed !== 'object' ||
                Array.isArray(parsed)
              ) {
                return { ...EMPTY }
              }

              const data = parsed as Record<string, unknown>

              if (
                typeof data.startOffset !== 'number' ||
                typeof data.endOffset !== 'number' ||
                !Number.isFinite(data.startOffset) ||
                !Number.isFinite(data.endOffset)
              ) {
                return { ...EMPTY }
              }

              return {
                startOffset: normalize(data.startOffset),
                endOffset: normalize(data.endOffset),
              }
            } catch {
              return { ...EMPTY }
            }
          }

          export function calculateCollectedTrim(
            original: CollectedTiming,
            offsets: Offsets
          ): CollectedTiming {
            const startSeconds = Math.max(
              0,
              original.startSeconds + offsets.startOffset
            )

            const endSeconds =
              original.startSeconds +
              original.duration +
              offsets.endOffset

            const duration = endSeconds - startSeconds

            if (
              !Number.isFinite(startSeconds) ||
              !Number.isFinite(endSeconds) ||
              duration < 0.25 ||
              duration > MAX_DURATION_SECONDS
            ) {
              throw new Error(
                'حدود التلاوة غير صالحة. ' +
                'اجعل النهاية بعد البداية ' +
                'ولا تتجاوز الحد الأقصى للفيديو.'
              )
            }

            const starts = original.starts.map(
              relative => Math.max(
                0,
                Math.min(
                  duration,
                  original.startSeconds +
                    relative -
                    startSeconds
                )
              )
            )

            return {
              startSeconds,
              duration,
              starts,
            }
          }

          export function applyStoredCollectedTrim<
            T extends CollectedTiming
          >(
            clip: T,
            surah: number,
            from: number,
            to: number
          ) {
            const saved = readSaved(surah, from, to)

            try {
              return {
                ...clip,
                ...calculateCollectedTrim(clip, saved),
              }
            } catch {
              return {
                ...clip,
                ...calculateCollectedTrim(clip, EMPTY),
              }
            }
          }

          async function waitForMetadata(
            audio: HTMLAudioElement
          ) {
            if (audio.readyState >= 1) return

            await new Promise<void>((resolve, reject) => {
              const cleanup = () => {
                window.clearTimeout(timeout)
                audio.removeEventListener(
                  'loadedmetadata',
                  success
                )
                audio.removeEventListener('error', failure)
              }

              const success = () => {
                cleanup()
                resolve()
              }

              const failure = () => {
                cleanup()
                reject(
                  new Error(
                    'تعذر تحميل التسجيل الصوتي للاختبار.'
                  )
                )
              }

              const timeout = window.setTimeout(
                failure,
                15000
              )

              audio.addEventListener(
                'loadedmetadata',
                success
              )
              audio.addEventListener('error', failure)

              audio.load()
            })
          }

          const button =
            'inline-flex min-h-11 items-center justify-center ' +
            'rounded-xl border border-[#d9cdb6] bg-white ' +
            'px-3 py-2 text-sm font-bold text-[#245343] ' +
            'disabled:opacity-40'

          export function Samee3CollectedTrimEditor({
            surah,
            from,
            to,
            streamUrl,
            original,
            disabled,
            onStop,
            onApply,
          }: EditorProps) {
            const [offsets, setOffsets] = useState<Offsets>(
              () => readSaved(surah, from, to)
            )

            const [message, setMessage] = useState('')
            const [error, setError] = useState('')
            const [preview, setPreview] = useState<
              'start' | 'end' | null
            >(null)

            const audioRef = useRef<HTMLAudioElement>(null)
            const intervalRef = useRef<number | null>(null)
            const timeoutRef = useRef<number | null>(null)
            const sequenceRef = useRef(0)

            const stopPreview = useCallback(() => {
              sequenceRef.current += 1

              if (intervalRef.current !== null) {
                window.clearInterval(intervalRef.current)
                intervalRef.current = null
              }

              if (timeoutRef.current !== null) {
                window.clearTimeout(timeoutRef.current)
                timeoutRef.current = null
              }

              audioRef.current?.pause()
              setPreview(null)
            }, [])

            useEffect(() => {
              return () => {
                sequenceRef.current += 1

                if (intervalRef.current !== null) {
                  window.clearInterval(intervalRef.current)
                }

                if (timeoutRef.current !== null) {
                  window.clearTimeout(timeoutRef.current)
                }

                audioRef.current?.pause()
              }
            }, [stopPreview])

            const current = (() => {
              try {
                return calculateCollectedTrim(
                  original,
                  offsets
                )
              } catch {
                return calculateCollectedTrim(
                  original,
                  EMPTY
                )
              }
            })()

            function changeOffset(
              kind: keyof Offsets,
              value: number
            ) {
              if (disabled) return

              const next: Offsets = {
                ...offsets,
                [kind]: normalize(value),
              }

              try {
                const timing = calculateCollectedTrim(
                  original,
                  next
                )

                stopPreview()
                onStop()
                onApply(timing)
                setOffsets(next)
                setError('')
                setMessage(
                  'تم تطبيق الضبط على التشغيل والتصدير.'
                )
              } catch (cause) {
                setError(
                  cause instanceof Error
                    ? cause.message
                    : 'تعذر ضبط التوقيت.'
                )
              }
            }

            function save() {
              try {
                localStorage.setItem(
                  storageKey(surah, from, to),
                  JSON.stringify(offsets)
                )

                setError('')
                setMessage(
                  'تم حفظ الضبط لهذا المقطع على جهازك.'
                )
              } catch {
                setError(
                  'تعذر الحفظ على هذا الجهاز.'
                )
              }
            }

            function reset() {
              if (disabled) return

              try {
                const timing = calculateCollectedTrim(
                  original,
                  EMPTY
                )

                stopPreview()
                onStop()
                onApply(timing)

                localStorage.removeItem(
                  storageKey(surah, from, to)
                )

                setOffsets({ ...EMPTY })
                setError('')
                setMessage(
                  'تمت استعادة التوقيت الأصلي.'
                )
              } catch (cause) {
                setError(
                  cause instanceof Error
                    ? cause.message
                    : 'تعذرت استعادة التوقيت.'
                )
              }
            }

            async function listen(
              side: 'start' | 'end'
            ) {
              if (disabled) return

              stopPreview()
              onStop()

              const audio = audioRef.current

              if (!audio) return

              const sequence = ++sequenceRef.current

              const begin =
                side === 'start'
                  ? current.startSeconds
                  : Math.max(
                      current.startSeconds,
                      current.startSeconds +
                        current.duration - 3
                    )

              const finish =
                side === 'start'
                  ? Math.min(
                      current.startSeconds +
                        current.duration,
                      current.startSeconds + 3
                    )
                  : current.startSeconds +
                    current.duration

              try {
                await waitForMetadata(audio)

                if (sequence !== sequenceRef.current) {
                  return
                }

                audio.currentTime = begin
                await audio.play()

                if (sequence !== sequenceRef.current) {
                  audio.pause()
                  return
                }

                setPreview(side)
                setError('')

                intervalRef.current = window.setInterval(
                  () => {
                    if (
                      audio.paused ||
                      audio.ended ||
                      audio.currentTime >= finish - 0.03
                    ) {
                      stopPreview()
                    }
                  },
                  35
                )

                timeoutRef.current = window.setTimeout(
                  stopPreview,
                  8000
                )
              } catch (cause) {
                stopPreview()

                setError(
                  cause instanceof Error
                    ? cause.message
                    : 'تعذر الاستماع للطرف المحدد.'
                )
              }
            }

            return (
              <section
                className="mt-4 rounded-2xl border border-[#d9c8a5] bg-[#fffcf3] p-4"
                dir="rtl"
              >
                <h3 className="text-base font-extrabold text-[#245343]">
                  ضبط بداية ونهاية تلاوة العفاسي المجمع
                </h3>

                <p className="mt-2 text-xs leading-6 text-[#746d5b]">
                  التحكم خاص بالمصحف المجمع فقط.
                  الرقم الموجب يؤخر الموضع، والسالب يقدمه.
                  مقدار الضبط 0.05 ثانية.
                </p>

                {([
                  {
                    key: 'startOffset' as const,
                    title: 'ضبط بداية التلاوة',
                  },
                  {
                    key: 'endOffset' as const,
                    title: 'ضبط نهاية التلاوة',
                  },
                ]).map(item => (
                  <div
                    key={item.key}
                    className="mt-4 rounded-xl border border-[#e7dfd0] bg-white p-3"
                  >
                    <label className="block text-sm font-bold text-[#245343]">
                      {item.title}
                    </label>

                    <div className="mt-3 flex items-center gap-3">
                      <input
                        aria-label={item.title}
                        type="range"
                        min={-30}
                        max={30}
                        step={0.05}
                        disabled={disabled}
                        value={offsets[item.key]}
                        onChange={event =>
                          changeOffset(
                            item.key,
                            Number(event.target.value)
                          )
                        }
                        className="min-w-0 flex-1 accent-[#245343]"
                      />

                      <input
                        aria-label={item.title + ' بالثواني'}
                        type="number"
                        min={-30}
                        max={30}
                        step={0.05}
                        disabled={disabled}
                        value={offsets[item.key]}
                        onChange={event =>
                          changeOffset(
                            item.key,
                            Number(event.target.value)
                          )
                        }
                        className="w-24 rounded-lg border border-[#d9cdb6] px-2 py-2 text-center text-sm"
                      />
                    </div>
                  </div>
                ))}

                <div className="mt-4 rounded-xl bg-white p-3 text-center text-xs leading-7 text-[#245343]">
                  البداية: {current.startSeconds.toFixed(2)}
                  {' '}ثانية
                  {' · '}
                  النهاية: {(
                    current.startSeconds +
                    current.duration
                  ).toFixed(2)}
                  {' '}ثانية
                  {' · '}
                  المدة: {current.duration.toFixed(2)}
                  {' '}ثانية
                </div>

                <audio
                  ref={audioRef}
                  src={streamUrl}
                  preload="auto"
                  className="hidden"
                />

                <div className="mt-3 grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    className={button}
                    disabled={disabled}
                    onClick={() => void listen('start')}
                  >
                    سماع أول 3 ثوانٍ
                  </button>

                  <button
                    type="button"
                    className={button}
                    disabled={disabled}
                    onClick={() => void listen('end')}
                  >
                    سماع آخر 3 ثوانٍ
                  </button>
                </div>

                {preview && (
                  <button
                    type="button"
                    className={button + ' mt-2 w-full'}
                    onClick={stopPreview}
                  >
                    إيقاف الاستماع
                  </button>
                )}

                <div className="mt-3 grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    className={button}
                    disabled={disabled}
                    onClick={save}
                  >
                    حفظ الضبط
                  </button>

                  <button
                    type="button"
                    className={button}
                    disabled={disabled}
                    onClick={reset}
                  >
                    التوقيت الأصلي
                  </button>
                </div>

                {message && (
                  <p
                    role="status"
                    className="mt-3 text-xs text-[#245343]"
                  >
                    {message}
                  </p>
                )}

                {error && (
                  <p
                    role="alert"
                    className="mt-3 text-xs text-red-700"
                  >
                    {error}
                  </p>
                )}
              </section>
            )
          }
          TSX

      - name: Integrate editor using TypeScript AST
        shell: bash
        run: |
          node <<'NODE'
          'use strict'

          const fs = require('node:fs')
          const ts = require('typescript')

          const file = 'app/visual-ayahs/page.tsx'
          const marker = 'SAMEE3_COLLECTED_MANUAL_TRIM_V3'
          const component =
            'app/visual-ayahs/Samee3CollectedTrimEditor.tsx'

          if (!fs.existsSync(file)) {
            throw new Error('Visual Ayahs source not found.')
          }

          if (!fs.existsSync(component)) {
            throw new Error('Precision editor source not found.')
          }

          let source = fs.readFileSync(file, 'utf8')

          if (source.includes(marker)) {
            console.log('V3 integration already exists.')
            process.exit(0)
          }

          // Avoid the broken line joins from earlier attempts.
          source = source.replace(
            /(useRef<HTMLAudioElement\s*\|\s*null>\(null\))[ \t]+(const collectedAudioNodeRef\s*=)/g,
            '$1\n\n  $2'
          )

          source = source.replace(
            /(\},\s*\[\s*\]\s*\))[ \t]+(const stopCollectedEdge\s*=)/g,
            '$1\n\n  $2'
          )

          const sf = ts.createSourceFile(
            file,
            source,
            ts.ScriptTarget.Latest,
            true,
            ts.ScriptKind.TSX
          )

          if (sf.parseDiagnostics.length) {
            throw new Error(
              'Existing Visual Ayahs page has syntax errors. ' +
              'No integration changes will be committed.'
            )
          }

          const edits = []

          function insert(pos, text) {
            edits.push({ start: pos, end: pos, text })
          }

          function replace(start, end, text) {
            edits.push({ start, end, text })
          }

          // Extend the existing Prepared type.
          let preparedType = null

          for (const statement of sf.statements) {
            if (
              ts.isTypeAliasDeclaration(statement) &&
              statement.name.text === 'Prepared' &&
              ts.isTypeLiteralNode(statement.type)
            ) {
              preparedType = statement.type
              break
            }
          }

          if (!preparedType) {
            throw new Error(
              'Prepared type could not be identified.'
            )
          }

          const existingOriginal = preparedType.members.some(
            member =>
              member.name?.getText(sf) ===
              'collectedOriginal'
          )

          if (!existingOriginal) {
            insert(
              preparedType.getEnd() - 1,
              '\n  collectedOriginal?: {' +
              '\n    startSeconds: number' +
              '\n    duration: number' +
              '\n    starts: number[]' +
              '\n  }\n'
            )
          }

          // Find the actual collected Alafasy preparation block.
          let target = null

          function isVariableNamed(statement, name) {
            return (
              ts.isVariableStatement(statement) &&
              statement.declarationList.declarations.some(
                decl => decl.name.getText(sf) === name
              )
            )
          }

          function visit(node) {
            if (ts.isBlock(node)) {
              const statements = [...node.statements]

              const clipIndex = statements.findIndex(
                statement =>
                  isVariableNamed(statement, 'clip') &&
                  statement.getText(sf).includes(
                    'loadCollectedVisualClip'
                  )
              )

              if (clipIndex >= 0) {
                const created = statements
                  .slice(clipIndex + 1)
                  .find(statement =>
                    isVariableNamed(statement, 'created')
                  )

                if (created) {
                  if (target) {
                    throw new Error(
                      'Multiple collected preparation blocks.'
                    )
                  }

                  target = created
                }
              }
            }

            ts.forEachChild(node, visit)
          }

          visit(sf)

          if (!target) {
            throw new Error(
              'Collected Alafasy preparation block missing. ' +
              'Existing readers will not be modified.'
            )
          }

          const declaration =
            target.declarationList.declarations.find(
              item => item.name.getText(sf) === 'created'
            )

          const obj = declaration?.initializer

          if (!obj || !ts.isObjectLiteralExpression(obj)) {
            throw new Error(
              'Collected Prepared object could not be parsed.'
            )
          }

          const property = (object, name) =>
            object.properties.find(
              item =>
                ts.isPropertyAssignment(item) &&
                item.name.getText(sf) === name
            )

          const startsProperty = property(obj, 'starts')
          const durationProperty = property(obj, 'duration')
          const streamProperty = property(obj, 'stream')

          if (
            !startsProperty ||
            !durationProperty ||
            !streamProperty ||
            !ts.isObjectLiteralExpression(
              streamProperty.initializer
            )
          ) {
            throw new Error(
              'Collected Prepared fields do not match ' +
              'the expected streaming structure.'
            )
          }

          const startSecondsProperty = property(
            streamProperty.initializer,
            'startSeconds'
          )

          if (!startSecondsProperty) {
            throw new Error(
              'Collected stream startSeconds is missing.'
            )
          }

          const expected = [
            [startsProperty, 'clip.starts'],
            [durationProperty, 'clip.duration'],
            [startSecondsProperty, 'clip.startSeconds'],
          ]

          for (const [item, value] of expected) {
            if (item.initializer.getText(sf) !== value) {
              throw new Error(
                'Unexpected collected timing expression: ' +
                item.initializer.getText(sf)
              )
            }
          }

          const lineStart =
            source.lastIndexOf(
              '\n',
              target.getStart(sf) - 1
            ) + 1

          const indentation = source.slice(
            lineStart,
            target.getStart(sf)
          )

          insert(
            target.getStart(sf),
            'const samee3AdjustedClip = ' +
            'applyStoredCollectedTrim(' +
            'clip, surah, from, to)\n' +
            indentation
          )

          replace(
            startsProperty.initializer.getStart(sf),
            startsProperty.initializer.getEnd(),
            'samee3AdjustedClip.starts'
          )

          replace(
            durationProperty.initializer.getStart(sf),
            durationProperty.initializer.getEnd(),
            'samee3AdjustedClip.duration'
          )

          replace(
            startSecondsProperty.initializer.getStart(sf),
            startSecondsProperty.initializer.getEnd(),
            'samee3AdjustedClip.startSeconds'
          )

          if (!property(obj, 'collectedOriginal')) {
            const last = obj.properties[
              obj.properties.length - 1
            ]

            const tail = source.slice(
              last.getEnd(),
              obj.getEnd() - 1
            )

            const comma = tail.includes(',') ? '' : ','

            insert(
              obj.getEnd() - 1,
              comma +
              '\n            collectedOriginal: {' +
              '\n              startSeconds: clip.startSeconds,' +
              '\n              duration: clip.duration,' +
              '\n              starts: clip.starts,' +
              '\n            },\n          '
            )
          }

          // Insert the UI at the existing prepared-audio area.
          const jsxLocations = []

          function findPreparedUI(node) {
            if (
              ts.isJsxExpression(node) &&
              node.expression &&
              ts.isBinaryExpression(node.expression) &&
              node.expression.operatorToken.kind ===
                ts.SyntaxKind.AmpersandAmpersandToken &&
              node.expression.left.getText(sf) === 'prepared'
            ) {
              jsxLocations.push(node.getStart(sf))
            }

            ts.forEachChild(node, findPreparedUI)
          }

          findPreparedUI(sf)

          if (!jsxLocations.length) {
            throw new Error(
              'Prepared audio UI location was not found.'
            )
          }

          const editorUI = `
            {reader === 'alafasy-collected' &&
              prepared?.stream &&
              prepared.collectedOriginal && (
                <Samee3CollectedTrimEditor
                  key={reader + ':' + surah + ':' + from + ':' + to}
                  surah={surah}
                  from={from}
                  to={to}
                  streamUrl={prepared.stream.url}
                  original={prepared.collectedOriginal}
                  disabled={working}
                  onStop={() => stopPlayback(true)}
                  onApply={timing => {
                    const current = preparedRef.current

                    if (!current?.stream || working) return

                    stopPlayback(true)
                    clearResult()

                    const updated: Prepared = {
                      ...current,
                      starts: timing.starts,
                      duration: timing.duration,
                      stream: {
                        ...current.stream,
                        startSeconds: timing.startSeconds,
                      },
                    }

                    preparedRef.current = updated
                    setPrepared(updated)
                  }}
                />
              )}

            `

          insert(jsxLocations[0], editorUI)

          // Import after 'use client', never inside JSX.
          const firstLineEnd = source.indexOf('\n')

          if (
            firstLineEnd < 0 ||
            !source.slice(0, firstLineEnd).includes(
              "'use client'"
            )
          ) {
            throw new Error(
              'The Visual Ayahs client directive is missing.'
            )
          }

          insert(
            firstLineEnd + 1,
            `// ${marker}\n` +
            `import {\n` +
            `  Samee3CollectedTrimEditor,\n` +
            `  applyStoredCollectedTrim,\n` +
            `} from './Samee3CollectedTrimEditor'\n`
          )

          // Apply changes from right to left, preserving offsets.
          edits.sort((a, b) => b.start - a.start)

          for (const edit of edits) {
            source =
              source.slice(0, edit.start) +
              edit.text +
              source.slice(edit.end)
          }

          const checked = ts.createSourceFile(
            file,
            source,
            ts.ScriptTarget.Latest,
            true,
            ts.ScriptKind.TSX
          )

          if (checked.parseDiagnostics.length) {
            const errors = checked.parseDiagnostics
              .slice(0, 5)
              .map(item =>
                ts.flattenDiagnosticMessageText(
                  item.messageText,
                  '\n'
                )
              )

            throw new Error(
              'Generated TSX failed syntax verification:\n' +
              errors.join('\n')
            )
          }

          const required = [
            marker,
            'samee3AdjustedClip.starts',
            'samee3AdjustedClip.duration',
            'samee3AdjustedClip.startSeconds',
            'collectedOriginal:',
            '<Samee3CollectedTrimEditor',
          ]

          for (const item of required) {
            if (!source.includes(item)) {
              throw new Error(
                'Incomplete integration: ' + item
              )
            }
          }

          // Write only after every structural check passes.
          fs.writeFileSync(file, source, 'utf8')

          console.log(
            'Precision trim V3 integrated successfully.'
