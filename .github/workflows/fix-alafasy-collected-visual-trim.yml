
name: SAMEE3 - Repair Collected Alafasy Visual Ayahs

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: samee3-repair-collected-visual
  cancel-in-progress: false

jobs:
  repair-and-build:
    name: Repair, Test and Save
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout SAMEE3 repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Repair Visual Ayahs syntax errors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/visual-ayahs/page.tsx")

          if not path.is_file():
              raise SystemExit(
                  "ERROR: app/visual-ayahs/page.tsx not found"
              )

          source = path.read_text(encoding="utf-8-sig")
          source = source.replace("\r\n", "\n")

          original = source

          # Repair the two audio reference declarations.
          source, count1 = re.subn(
              r"(useRef<HTMLAudioElement\s*\|\s*null>\(null\))"
              r"[ \t]+"
              r"(const collectedAudioNodeRef\s*=)",
              r"\1\n\n  \2",
              source,
          )

          if count1 > 1:
              raise SystemExit(
                  "ERROR: Multiple audio reference matches."
              )

          # Repair the function definition merged with clearResult.
          source, count2 = re.subn(
              r"(\},\s*\[\s*\]\s*\))"
              r"[ \t]+"
              r"(const stopCollectedEdge\s*=)",
              r"\1\n\n  \2",
              source,
          )

          if count2 > 1:
              raise SystemExit(
                  "ERROR: Multiple playback cleanup matches."
              )

          # Validate that required definitions exist.
          required = [
              "const collectedAudioRef =",
              "const collectedAudioNodeRef =",
              "const stopCollectedEdge =",
              "const stopPlayback =",
          ]

          for token in required:
              if source.count(token) != 1:
                  raise SystemExit(
                      "ERROR: Missing or duplicate definition: "
                      + token
                  )

          # Check that the two reported invalid joins are gone.
          invalid_joins = [
              re.compile(
                  r"useRef<HTMLAudioElement\s*\|\s*null>"
                  r"\(null\)[ \t]+const"
              ),
              re.compile(
                  r"\},\s*\[\s*\]\s*\)"
                  r"[ \t]+const stopCollectedEdge"
              ),
          ]

          for pattern in invalid_joins:
              if pattern.search(source):
                  raise SystemExit(
                      "ERROR: Invalid merged declaration remains."
                  )

          if source != original:
              path.write_text(source, encoding="utf-8")
              print("SUCCESS: Visual Ayahs syntax repaired.")
          else:
              print("INFO: The reported syntax errors are already fixed.")

          print("Audio reference repairs:", count1)
          print("Playback function repairs:", count2)
          print("Other readers and visual templates preserved.")
          PY

      - name: Show repaired code locations
        shell: bash
        run: |
          grep -n -A 4 -B 2 \
            'const collectedAudioRef =' \
            app/visual-ayahs/page.tsx

          grep -n -A 5 -B 2 \
            'const stopCollectedEdge =' \
            app/visual-ayahs/page.tsx

      - name: Install dependencies
        run: npm ci

      - name: Build SAMEE3
        run: npm run build

      - name: Commit repaired file after successful build
        shell: bash
        run: |
          if git diff --quiet -- app/visual-ayahs/page.tsx; then
            echo "No file changes needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/visual-ayahs/page.tsx

          git commit -m \
            "fix: repair collected Alafasy visual ayahs syntax"

          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Final summary
        shell: bash
        run: |
          echo "### SAMEE3 Visual Ayahs Repair" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- Syntax repair: completed" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- Production build: passed" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- Other reciters: unchanged" \
            >> "$GITHUB_STEP_SUMMARY"
