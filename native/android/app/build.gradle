plugins { id 'com.android.application' }

android {
    namespace 'app.samee3.quran'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'app.samee3.quran'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }
    sourceSets { main { assets.srcDirs = ['../../shared', 'src/main/assets'] } }
    signingConfigs {
        release {
            if (System.getenv('SAMEE3_KEYSTORE_PATH')) {
                storeFile file(System.getenv('SAMEE3_KEYSTORE_PATH'))
                storePassword System.getenv('SAMEE3_STORE_PASSWORD')
                keyAlias System.getenv('SAMEE3_KEY_ALIAS')
                keyPassword System.getenv('SAMEE3_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('SAMEE3_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            ['http.proxyHost','http.proxyPort','https.proxyHost','https.proxyPort'].each { name ->
                if (System.getProperty(name)) systemProperty name, System.getProperty(name)
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

// Sync the website logo into each new APK. Standalone native source keeps its bundled icon.
def websiteIcon = rootProject.file('../../public/icon-512.png')
def syncAndroidBrand = tasks.register('syncAndroidBrand', Copy) {
    onlyIf { websiteIcon.exists() }
    from(websiteIcon)
    into('src/main/res/drawable')
    rename { 'app_icon.png' }
}
tasks.named('preBuild').configure { dependsOn(syncAndroidBrand) }
